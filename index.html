<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>F&O Pro Trading Dashboard</title>

    <!-- =========================================================
         TAILWIND
    ========================================================== -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

    <!-- =========================================================
         FIREBASE
    ========================================================== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeSpeed;
        }

        button,
        select,
        input {
            font-family: inherit;
        }

        /* =====================================================
           TABLE
        ====================================================== */

        .dashboard-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
        }

        .dashboard-table {
            min-width: 1250px;
            width: 100%;
            border-collapse: collapse;
        }

        .dashboard-table th {
            position: sticky !important;
            top: 0 !important;
            z-index: 20 !important;

            background: #172554 !important;
            color: #ffffff !important;

            cursor: pointer;
            user-select: none;

            white-space: nowrap;
        }

        .dashboard-table td {
            white-space: nowrap;
        }

        .dashboard-table tbody tr {
            transition: background-color 0.1s ease;
        }

        .dashboard-table tbody tr:hover {
            background-color: rgba(59, 130, 246, 0.06);
        }

        /* =====================================================
           TREND TABLE
        ====================================================== */

        .trend-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .trend-table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        .trend-table th {
            background: #172554 !important;
            color: white !important;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .trend-table td {
            white-space: nowrap;
        }

        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 640px) {

            body {
                padding: 8px !important;
            }

            #top-control-bar {
                padding: 10px !important;
                gap: 8px !important;
            }

            #tab-buttons {
                width: 100%;
                overflow-x: auto;
                justify-content: flex-start;
            }

            #tab-buttons button {
                flex: 0 0 auto;
            }

            #right-controls {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 6px;
            }

            #right-controls > div,
            #right-controls > button {
                width: 100%;
                justify-content: center;
            }

            .dashboard-table {
                min-width: 1250px;
            }

            .dashboard-table th,
            .dashboard-table td {
                padding: 10px 9px !important;
                font-size: 11px !important;
            }

            #view-trend {
                padding: 10px !important;
            }

            .trend-table th,
            .trend-table td {
                padding: 9px !important;
                font-size: 11px !important;
            }
        }

        /* =====================================================
           ERROR BOX
        ====================================================== */

        #error-box {
            display: none;
        }

        /* =====================================================
           FIREBASE STATUS DOT
        ====================================================== */

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-online {
            background: #22c55e;
            box-shadow: 0 0 7px rgba(34,197,94,0.7);
        }

        .status-offline {
            background: #ef4444;
            box-shadow: 0 0 7px rgba(239,68,68,0.7);
        }

    </style>
</head>


<body
    id="body-tag"
    class="p-2 sm:p-4 bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200"
>


    <!-- =========================================================
         ERROR BOX
    ========================================================== -->

    <div
        id="error-box"
        class="w-full mb-3 bg-red-50 dark:bg-red-950/40 border border-red-300 dark:border-red-800 text-red-700 dark:text-red-300 rounded-xl p-3 text-xs font-bold"
    >
    </div>


    <!-- =========================================================
         TOP CONTROL BAR
    ========================================================== -->

    <div

        <!-- TABS -->

        <div

            <button

        <!-- RIGHT CONTROLS -->

        <div

            <!-- TIME -->

            <div

            <!-- SHOW PERCENT -->

    </div>


    <!-- =========================================================
         VIEW 1 : DASHBOARD
    ========================================================== -->

    <div

    <!-- =========================================================

    ========================================================== -->

    <div
        id="view-trend"

    >

        <h2
            class="text-lg font-bold text-cyan-600 dark:text-cyan-400 mb-4"
        >
            🚀 Divergence Trend Scanner
        </h2>


        <div

            <button

        <div

    <script>

        /* =========================================================
           GLOBAL CONFIG
        ========================================================== */

        const FIREBASE_URL =
            "https://fyers-bot-606b9-default-rtdb.firebaseio.com";


        /* =========================================================
           FIREBASE INIT
        ========================================================== */

        let firebaseApp;

        try {

            firebaseApp = firebase.initializeApp({
                databaseURL: FIREBASE_URL
            });

        } catch (error) {

            showError(
                "Firebase initialization failed: " + error.message
            );

        }


        const db = firebase.database();


        /* =========================================================
           GLOBAL DATA
        ========================================================== */

        let globalDashboardData = [];

        let globalChartRawData = [];

        let sortDirections = {};

        let trendTimer = null;


        /* =========================================================
           UTILITY
        ========================================================== */

        function safeNumber(value, fallback = 0) {

            const n = parseFloat(value);

            return Number.isFinite(n)
                ? n
                : fallback;

        }


        function getSymbol(item) {

            return String(
                item?.SYMS ??
                item?.SYMBOL ??
                item?.Symbol ??
                ""
            ).trim();

        }


        function getTime(item) {

            return String(
                item?.Time ??
                ""
            ).trim();

        }


        function getISTDateStr() {

            const now = new Date();

            const istString = now.toLocaleString(
                "en-US",
                {
                    timeZone: "Asia/Kolkata"
                }
            );

            const ist = new Date(istString);

            const yr = ist.getFullYear();

            const mo = String(
                ist.getMonth() + 1
            ).padStart(2, "0");

            const da = String(
                ist.getDate()
            ).padStart(2, "0");

            return `${yr}-${mo}-${da}`;

        }


        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================================
           ERROR HANDLING
        ========================================================== */

        function showError(message) {

            console.error(message);

            const box =
                document.getElementById("error-box");

            if (!box) return;

            box.style.display = "block";

            box.innerHTML =
                "⚠️ " +
                escapeHtml(message);

        }


        function hideError() {

            const box =
                document.getElementById("error-box");

            if (!box) return;

            box.style.display = "none";

        }


        window.addEventListener(
            "error",
            function(event) {

                showError(
                    "JavaScript Error: " +
                    event.message
                );

            }
        );


        window.addEventListener(
            "unhandledrejection",
            function(event) {

                showError(
                    "Script Error: " +
                    String(event.reason)
                );

            }
        );


        /* =========================================================
           FIREBASE STATUS
        ========================================================== */

        function setFirebaseStatus(online) {

            const dot =
                document.getElementById("firebase-dot");

            const text =
                document.getElementById("firebase-status-text");

            if (!dot || !text) return;

            if (online) {

                dot.className =
                    "status-dot status-online";

                text.innerText =
                    "Live";

                text.className =
                    "text-green-600 dark:text-green-400";

            } else {

                dot.className =
                    "status-dot status-offline";

                text.innerText =
                    "Offline";

                text.className =
                    "text-red-600 dark:text-red-400";

            }

        }


        db.ref(".info/connected").on(
            "value",
            snapshot => {

                setFirebaseStatus(
                    snapshot.val() === true
                );

            },
            error => {

                setFirebaseStatus(false);

                showError(
                    "Firebase connection error: " +
                    error.message
                );

            }
        );


        /* =========================================================
           THEME
        ========================================================== */

        function toggleTheme() {

            const body =
                document.getElementById("body-tag");

            const btn =
                document.getElementById("theme-btn");


            if (body.classList.contains("dark")) {

                body.classList.remove("dark");

                btn.innerText =
                    "☀️ Light";

                btn.className =
                    "px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-bold text-amber-500 transition shadow-sm";

            } else {

                body.classList.add("dark");

                btn.innerText =
                    "🌙 Dark";

                btn.className =
                    "px-3 py-2 rounded-lg border border-slate-800 bg-slate-950 text-xs font-bold text-yellow-400 transition shadow-sm";

            }

        }


        /* =========================================================
           FIREBASE : DASHBOARD
        ========================================================== */

        db.ref("Dashboard/Latest").on(

            "value",

            snapshot => {

                try {

                    const val =
                        snapshot.val();

                    if (!val) {

                        return;

                    }


                    if (val.time) {

                        const date =
                            new Date(
                                Number(val.time) * 1000
                            );

                        document
                            .getElementById("live-time")
                            .innerText =
                            date.toLocaleTimeString(
                                "en-IN",
                                {
                                    hour: "2-digit",
                                    minute: "2-digit",
                                    second: "2-digit"
                                }
                            );

                    }


                    const incoming =
                        Array.isArray(val.data)
                            ? val.data
                            : [];


                    globalDashboardData =
                        incoming;


                    hideError();

                    renderDashboard();

                    scheduleTrendScanner();

                } catch (error) {

                    showError(
                        "Dashboard data error: " +
                        error.message
                    );

                }

            },

            error => {

                showError(
                    "Unable to read Dashboard/Latest: " +
                    error.message
                );

            }

        );


        /* =========================================================
           FIREBASE : CHART HISTORY (Kept for Trend Scanner)
        ========================================================== */

        db.ref("ChartHistory").on(

            "value",

            snapshot => {

                try {

                    const val =
                        snapshot.val();

                    if (!val) {

                        globalChartRawData = [];

                        return;

                    }


                    const todayPrefix =
                        getISTDateStr()
                            .replace(/-/g, "");


                    const rows = [];


                    Object.keys(val).forEach(key => {

                        if (
                            !key.startsWith(
                                todayPrefix
                            )
                        ) {

                            return;

                        }


                        const entry =
                            val[key];


                        if (
                            entry &&
                            Array.isArray(entry.data)
                        ) {

                            for (
                                let i = 0;
                                i < entry.data.length;
                                i++
                            ) {

                                rows.push(
                                    entry.data[i]
                                );

                            }

                        }

                    });


                    globalChartRawData =
                        rows;


                    scheduleTrendScanner();

                } catch (error) {

                    showError(
                        "Chart history error: " +
                        error.message
                    );

                }

            },

            error => {

                showError(
                    "Unable to read ChartHistory: " +
                    error.message
                );

            }

        );


        /* =========================================================
           TAB SWITCH
        ========================================================== */

        function switchTab(tab) {

            const tabs =
                ["dash", "chart", "trend"];


            tabs.forEach(t => {

                const view =
                    document.getElementById(
                        `view-${t}`
                    );

                const btn =
                    document.getElementById(
                        `btn-${t}`
                    );


                view.classList.add("hidden");


                btn.className =
                    "px-4 py-2 rounded-md text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition";

            });


            const selectedView =
                document.getElementById(
                    `view-${tab}`
                );

            const selectedButton =
                document.getElementById(
                    `btn-${tab}`
                );


            selectedView.classList.remove(
                "hidden"
            );


            selectedButton.className =
                "px-4 py-2 rounded-md text-xs sm:text-sm font-bold bg-blue-600 text-white transition";

        }


        /* =========================================================
           TREND SUB TAB
        ========================================================== */

        function switchTrendSubTab(sub) {

            const bull =
                document.getElementById(
                    "subtab-bullish"
                );

            const bear =
                document.getElementById(
                    "subtab-bearish"
                );

            const bullBtn =
                document.getElementById(
                    "btn-sub-bull"
                );

            const bearBtn =
                document.getElementById(
                    "btn-sub-bear"
                );


            if (sub === "bullish") {

                bull.classList.remove(
                    "hidden"
                );

                bear.classList.add(
                    "hidden"
                );


                bullBtn.className =
                    "px-4 py-2 rounded-lg text-xs font-bold bg-green-600 text-white transition whitespace-nowrap";

                bearBtn.className =
                    "px-4 py-2 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-400 transition whitespace-nowrap";

            } else {

                bull.classList.add(
                    "hidden"
                );

                bear.classList.remove(
                    "hidden"
                );


                bearBtn.className =
                    "px-4 py-2 rounded-lg text-xs font-bold bg-red-600 text-white transition whitespace-nowrap";

                bullBtn.className =
                    "px-4 py-2 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-400 transition whitespace-nowrap";

            }

        }


        /* =========================================================
           TREND SCANNER SCHEDULER
        ========================================================== */

        function scheduleTrendScanner() {

            clearTimeout(trendTimer);

            trendTimer =
                setTimeout(
                    () => {
                        runTrendScanner();
                    },
                    250
                );

        }


        /* =========================================================
           OPTIMIZED TREND SCANNER
        ========================================================== */

        function runTrendScanner() {

            if (
                globalChartRawData.length === 0 ||
                globalDashboardData.length === 0
            ) {

                return;

            }


            try {

                const todayStr =
                    getISTDateStr();


                /* -------------------------------------------------
                   BUILD DASHBOARD LOOKUP
                -------------------------------------------------- */

                const latestLookup =
                    Object.create(null);


                for (
                    let i = 0;
                    i < globalDashboardData.length;
                    i++
                ) {

                    const item =
                        globalDashboardData[i];


                    const sym =
                        getSymbol(item);


                    if (sym) {

                        latestLookup[sym] =
                            item;

                    }

                }


                /* -------------------------------------------------
                   BUILD SYMBOL DATA IN ONE PASS
                -------------------------------------------------- */

                const symbolMap =
                    new Map();


                for (
                    let i = 0;
                    i < globalChartRawData.length;
                    i++
                ) {

                    const r =
                        globalChartRawData[i];


                    const date =
                        String(
                            r.Date ?? ""
                        ).trim();


                    if (
                        date !== todayStr
                    ) {

                        continue;

                    }


                    const sym =
                        getSymbol(r);


                    if (!sym) {

                        continue;

                    }


                    if (
                        !symbolMap.has(sym)
                    ) {

                        symbolMap.set(
                            sym,
                            []
                        );

                    }


                    symbolMap
                        .get(sym)
                        .push(r);

                }


                const bullishRows = [];

                const bearishRows = [];


                /* -------------------------------------------------
                   PROCESS EACH SYMBOL
                -------------------------------------------------- */

                symbolMap.forEach(
                    (rows, sym) => {

                        if (
                            rows.length < 5
                        ) {

                            return;

                        }


                        rows.sort(
                            (a, b) =>
                                getTime(a)
                                    .localeCompare(
                                        getTime(b)
                                    )
                        );


                        const volSeries = [];

                        const pcrSeries = [];

                        const ltpSeries = [];


                        for (
                            let i = 0;
                            i < rows.length;
                            i++
                        ) {

                            const r =
                                rows[i];


                            const vol =
                                safeNumber(
                                    r["VOL CPR"] ??
                                    r["Vol CPR"] ??
                                    r["V_CPR"],
                                    NaN
                                );


                            const pcr =
                                safeNumber(
                                    r["OPT PCR"] ??
                                    r["Opt PCR"] ??
                                    r["O_PCR"],
                                    NaN
                                );


                            const ltp =
                                safeNumber(
                                    r["LTP"],
                                    NaN
                                );


                            if (
                                Number.isFinite(vol)
                            ) {

                                volSeries.push(
                                    vol
                                );

                            }


                            if (
                                Number.isFinite(pcr)
                            ) {

                                pcrSeries.push(
                                    pcr
                                );

                            }


                            if (
                                Number.isFinite(ltp)
                            ) {

                                ltpSeries.push(
                                    ltp
                                );

                            }

                        }


                        if (
                            volSeries.length === 0 ||
                            pcrSeries.length === 0 ||
                            ltpSeries.length === 0
                        ) {

                            return;

                        }


                        const firstCount =
                            Math.min(
                                4,
                                volSeries.length
                            );


                        let firstVol = 0;

                        let firstPcr = 0;

                        let firstLtp = 0;


                        for (
                            let i = 0;
                            i < firstCount;
                            i++
                        ) {

                            firstVol +=
                                volSeries[i] || 0;

                            firstPcr +=
                                pcrSeries[i] || 0;

                            firstLtp +=
                                ltpSeries[i] || 0;

                        }


                        firstVol /=
                            firstCount;

                        firstPcr /=
                            firstCount;

                        firstLtp /=
                            firstCount;


                        const lastVol =
                            volSeries[
                                volSeries.length - 1
                            ];


                        const lastPcr =
                            pcrSeries[
                                pcrSeries.length - 1
                            ];


                        const lastLtp =
                            ltpSeries[
                                ltpSeries.length - 1
                            ];


                        if (
                            firstVol === 0 ||
                            !Number.isFinite(firstVol) ||
                            firstLtp === 0 ||
                            !Number.isFinite(firstLtp)
                        ) {

                            return;

                        }


                        let maxVol =
                            -Infinity;

                        let minVol =
                            Infinity;


                        for (
                            let i = 0;
                            i < volSeries.length;
                            i++
                        ) {

                            if (
                                volSeries[i] >
                                maxVol
                            ) {

                                maxVol =
                                    volSeries[i];

                            }


                            if (
                                volSeries[i] <
                                minVol
                            ) {

                                minVol =
                                    volSeries[i];

                            }

                        }


                        const priceMovementPct =
                            Math.abs(
                                (
                                    lastLtp -
                                    firstLtp
                                ) /
                                firstLtp
                            ) * 100;


                        const isPriceStuck =
                            priceMovementPct <=
                            1.5;


                        if (!isPriceStuck) {

                            return;

                        }


                        const info =
                            latestLookup[sym] ||
                            {};


                        const ceCon =
                            safeNumber(
                                info.CE_CON
                            );


                        const peCon =
                            safeNumber(
                                info.PE_CON
                            );


                        const chgPct =
                            safeNumber(
                                info["CHG_%"]
                            );


                        const optPcr =
                            safeNumber(
                                info.O_PCR
                            );


                        const volCpr =
                            safeNumber(
                                info.V_CPR
                            );


                        /* -----------------------------------------
                           BULLISH
                        ------------------------------------------ */

                        const isVolBullish =
                            lastVol >
                                firstVol &&
                            lastVol >=
                                maxVol * 0.75;


                        const isPcrBullish =
                            lastPcr >=
                            firstPcr * 0.90;


                        if (
                            isVolBullish &&
                            isPcrBullish &&
                            ceCon >= 70
                        ) {

                            bullishRows.push(
                                {
                                    sym,
                                    chg: chgPct,
                                    pcr: optPcr,
                                    cpr: volCpr,
                                    ce: ceCon
                                }
                            );

                        }


                        /* -----------------------------------------
                           BEARISH
                        ------------------------------------------ */

                        const isVolBearish =
                            lastVol <
                                firstVol &&
                            (
                                minVol > 0.1
                                    ? lastVol <=
                                      minVol * 1.25
                                    : lastVol <=
                                      0.5
                            );


                        const isPcrBearish =
                            lastPcr <=
                            firstPcr * 1.10;


                        if (
                            isVolBearish &&
                            isPcrBearish &&
                            peCon >= 70
                        ) {

                            bearishRows.push(
                                {
                                    sym,
                                    chg: chgPct,
                                    pcr: optPcr,
                                    cpr: volCpr,
                                    pe: peCon
                                }
                            );

                        }

                    }
                );


                renderTrendTables(
                    bullishRows,
                    bearishRows
                );


            } catch (error) {

                showError(
                    "Trend scanner error: " +
                    error.message
                );

            }

        }


        /* =========================================================
           TREND TABLE RENDER
        ========================================================== */

        function renderTrendTables(
            bullishRows,
            bearishRows
        ) {

            /* -----------------------------------------------------
               BULLISH SORT
            ------------------------------------------------------ */

            bullishRows.sort(
                (a, b) =>
                    b.ce - a.ce
            );


            let bullishHtml = `

                <table class="trend-table text-xs text-center">

                    <thead>
                        <tr class="border-b border-blue-800">

                            <th class="p-2.5">
                                SYMBOL
                            </th>

                            <th class="p-2.5">
                                CHANGE %
                            </th>

                            <th class="p-2.5">
                                OPT PCR
                            </th>

                            <th class="p-2.5">
                                VOL CPR
                            </th>

                            <th class="p-2.5">
                                CE CONTRACT
                            </th>

                        </tr>
                    </thead>

                    <tbody>
            `;


            if (
                bullishRows.length === 0
            ) {

                bullishHtml += `

                    <tr>
                        <td
                            colspan="5"
                            class="p-6 text-slate-400"
                        >
                            No Bullish Stocks Matched
                        </td>
                    </tr>

                `;

            } else {

                for (
                    let i = 0;
                    i < bullishRows.length;
                    i++
                ) {

                    const r =
                        bullishRows[i];


                    bullishHtml += `

                        <tr class="border-b border-slate-200 dark:border-slate-800">

                            <td class="p-2.5 font-bold">
                                ${escapeHtml(r.sym)}
                            </td>

                            <td class="p-2.5 text-green-600 dark:text-green-400 font-bold">
                                ${r.chg >= 0 ? "+" : ""}
                                ${r.chg.toFixed(2)}%
                            </td>

                            <td class="p-2.5">
                                ${r.pcr.toFixed(2)}
                            </td>

                            <td class="p-2.5">
                                ${r.cpr.toFixed(2)}
                            </td>

                            <td class="p-2.5 text-green-600 dark:text-green-400 font-bold">
                                +${r.ce.toFixed(1)}%
                            </td>

                        </tr>

                    `;

                }

            }


            bullishHtml += `
                    </tbody>
                </table>
            `;


            document
                .getElementById(
                    "subtab-bullish"
                )
                .innerHTML =
                bullishHtml;


            /* -----------------------------------------------------
               BEARISH SORT
            ------------------------------------------------------ */

            bearishRows.sort(
                (a, b) =>
                    b.pe - a.pe
            );


            let bearishHtml = `

                <table class="trend-table text-xs text-center">

                    <thead>
                        <tr class="border-b border-blue-800">

                            <th class="p-2.5">
                                SYMBOL
                            </th>

                            <th class="p-2.5">
                                CHANGE %
                            </th>

                            <th class="p-2.5">
                                OPT PCR
                            </th>

                            <th class="p-2.5">
                                VOL CPR
                            </th>

                            <th class="p-2.5">
                                PE CONTRACT
                            </th>

                        </tr>
                    </thead>

                    <tbody>
            `;


            if (
                bearishRows.length === 0
            ) {

                bearishHtml += `

                    <tr>
                        <td
                            colspan="5"
                            class="p-6 text-slate-400"
                        >
                            No Bearish Stocks Matched
                        </td>
                    </tr>

                `;

            } else {

                for (
                    let i = 0;
                    i < bearishRows.length;
                    i++
                ) {

                    const r =
                        bearishRows[i];


                    bearishHtml += `

                        <tr class="border-b border-slate-200 dark:border-slate-800">

                            <td class="p-2.5 font-bold">
                                ${escapeHtml(r.sym)}
                            </td>

                            <td class="p-2.5 text-red-600 dark:text-red-400 font-bold">
                                ${r.chg.toFixed(2)}%
                            </td>

                            <td class="p-2.5">
                                ${r.pcr.toFixed(2)}
                            </td>

                            <td class="p-2.5">
                                ${r.cpr.toFixed(2)}
                            </td>

                            <td class="p-2.5 text-red-600 dark:text-red-400 font-bold">
                                +${r.pe.toFixed(1)}%
                            </td>

                        </tr>

                    `;

                }

            }


            bearishHtml += `
                    </tbody>
                </table>
            `;


            document
                .getElementById(
                    "subtab-bearish"
                )
                .innerHTML =
                bearishHtml;

        }


        /* =========================================================
           DASHBOARD RENDER
        ========================================================== */

        function renderDashboard() {

            const toggle =
                document.getElementById(
                    "show-pct-toggle"
                );


            const showPct =
                toggle
                    ? toggle.checked
                    : true;


            const tbody =
                document.getElementById(
                    "table-body"
                );


            if (
                globalDashboardData.length === 0
            ) {

                tbody.innerHTML = `

                    <tr>
                        <td
                            colspan="12"
                            class="text-center p-8 text-slate-400"
                        >
                            ⏳ Waiting for Firebase data...
                        </td>
                    </tr>

                `;

                return;

            }


            /* -----------------------------------------------------
               SORT BY CONTRACT STRENGTH
            ------------------------------------------------------ */

            const sortedData =
                [...globalDashboardData]
                    .sort(
                        (a, b) => {

                            const aValue =
                                Math.abs(
                                    safeNumber(
                                        a.CE_CON
                                    )
                                ) +
                                Math.abs(
                                    safeNumber(
                                        a.PE_CON
                                    )
                                );


                            const bValue =
                                Math.abs(
                                    safeNumber(
                                        b.CE_CON
                                    )
                                ) +
                                Math.abs(
                                    safeNumber(
                                        b.PE_CON
                                    )
                                );


                            return (
                                bValue -
                                aValue
                            );

                        }
                    );


            const fragment =
                document.createDocumentFragment();


            /* -----------------------------------------------------
               BUILD ROWS
            ------------------------------------------------------ */

            for (
                let i = 0;
                i < sortedData.length;
                i++
            ) {

                const item =
                    sortedData[i];


                const row =
                    document.createElement(
                        "tr"
                    );


                const openStatus =
                    String(
                        item.OPEN_STATUS ??
                        ""
                    );


                const chgPct =
                    safeNumber(
                        item["CHG_%"]
                    );


                const ltpChg =
                    safeNumber(
                        item.LTP_CH
                    );


                const ce =
                    safeNumber(
                        item.CE_CON
                    );


                const pe =
                    safeNumber(
                        item.PE_CON
                    );


                const vPcr =
                    safeNumber(
                        item.V_PCR
                    );


                const oPcr =
                    safeNumber(
                        item.O_PCR
                    );


                const vCpr =
                    safeNumber(
                        item.V_CPR
                    );


                const ltp =
                    safeNumber(
                        item.LTP
                    );


                const pcrVal =
                    showPct
                        ? safeNumber(
                            item.PCR_PCT
                        )
                        : safeNumber(
                            item.PCR_ABS
                        );


                const volVal =
                    showPct
                        ? safeNumber(
                            item.VOL_PCT
                        )
                        : safeNumber(
                            item.VOL_ABS
                        );


                const openColor =
                    openStatus.includes(
                        "Gap Up"
                    )
                        ? "#00AA00"
                        : openStatus.includes(
                            "Gap Down"
                        )
                            ? "#FF0000"
                            : "#00BFFF";


                const chgColor =
                    chgPct > 0
                        ? "#00AA00"
                        : chgPct < 0
                            ? "#FF0000"
                            : "#888888";


                const ltpChgColor =
                    ltpChg > 0
                        ? "#00AA00"
                        : ltpChg < 0
                            ? "#FF0000"
                            : "#888888";


                const ceColor =
                    ce > 0
                        ? "#00AA00"
                        : ce < 0
                            ? "#FF0000"
                            : "#888888";


                const peColor =
                    pe > 0
                        ? "#00AA00"
                        : pe < 0
                            ? "#FF0000"
                            : "#888888";


                const vPcrColor =
                    vPcr >= 1
                        ? "#00AA00"
                        : "#FF0000";


                const oPcrColor =
                    oPcr >= 1
                        ? "#00AA00"
                        : "#FF0000";


                const vCprColor =
                    vCpr >= 1
                        ? "#00AA00"
                        : "#FF0000";


                const pcrColor =
                    pcrVal >= 0
                        ? "#00AA00"
                        : "#FF0000";


                const volColor =
                    volVal >= 0
                        ? "#00AA00"
                        : "#FF0000";


                row.innerHTML = `

                    <td class="p-3 text-center font-bold">
                        ${escapeHtml(
                            getSymbol(item)
                        )}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${openColor}"
                    >
                        ${escapeHtml(
                            openStatus
                        )}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${vPcrColor}"
                    >
                        ${vPcr.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${oPcrColor}"
                    >
                        ${oPcr.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${vCprColor}"
                    >
                        ${vCpr.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${ltpChgColor}"
                    >
                        ${ltpChg >= 0 ? "+" : ""}
                        ${ltpChg.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${chgColor}"
                    >
                        ${chgPct >= 0 ? "+" : ""}
                        ${chgPct.toFixed(2)}%
                    </td>


                    <td class="p-3 text-center font-bold">
                        ${ltp.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${ceColor}"
                    >
                        ${ce >= 0 ? "+" : ""}
                        ${ce.toFixed(1)}%
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${peColor}"
                    >
                        ${pe >= 0 ? "+" : ""}
                        ${pe.toFixed(1)}%
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${pcrColor}"
                    >
                        ${pcrVal.toFixed(2)}
                        ${showPct ? "%" : ""}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${volColor}"
                    >
                        ${volVal.toFixed(2)}
                        ${showPct ? "%" : ""}
                    </td>

                `;


                fragment.appendChild(
                    row
                );

            }


            tbody.innerHTML = "";

            tbody.appendChild(
                fragment
            );

        }


        /* =========================================================
           TABLE SORTING
        ========================================================== */

        function sortTable(columnIndex) {

            const table =
                document.querySelector(
                    ".dashboard-table"
                );


            if (!table) return;


            const tbody =
                table.querySelector(
                    "tbody"
                );


            const rows =
                Array.from(
                    tbody.querySelectorAll(
                        "tr"
                    )
                );


            if (
                rows.length === 0
            ) {

                return;

            }


            sortDirections[columnIndex] =
                !sortDirections[columnIndex];


            const asc =
                sortDirections[columnIndex];


            rows.sort(
                (rowA, rowB) => {

                    const cellA =
                        rowA.cells[columnIndex];


                    const cellB =
                        rowB.cells[columnIndex];


                    if (!cellA || !cellB) {

                        return 0;

                    }


                    const textA =
                        cellA.innerText
                            .replace(
                                /[%+,]/g,
                                ""
                            )
                            .trim();


                    const textB =
                        cellB.innerText
                            .replace(
                                /[%+,]/g,
                                ""
                            )
                            .trim();


                    const numA =
                        parseFloat(
                            textA
                        );


                    const numB =
                        parseFloat(
                            textB
                        );


                    if (
                        Number.isFinite(numA) &&
                        Number.isFinite(numB)
                    ) {

                        return asc
                            ? numA - numB
                            : numB - numA;

                    }


                    return asc
                        ? textA.localeCompare(
                            textB
                        )
                        : textB.localeCompare(
                            textA
                        );

                }
            );


            const fragment =
                document.createDocumentFragment();


            rows.forEach(
                row =>
                    fragment.appendChild(
                        row
                    )
            );


            tbody.innerHTML = "";

            tbody.appendChild(
                fragment
            );

        }


        /* =========================================================
           INITIAL STATUS
        ========================================================== */

        setFirebaseStatus(false);


        /* =========================================================
           INITIAL DASH TAB
        ========================================================== */

        switchTab("dash");

    </script>
