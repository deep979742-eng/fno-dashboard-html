        /* =========================================================
           OPTIMIZED TREND SCANNER
        ========================================================== */

        function runTrendScanner() {

            if (
                globalChartRawData.length === 0 ||
                globalDashboardData.length === 0
            ) {

                return;

            }


            try {

                const todayStr =
                    getISTDateStr();


                /* -------------------------------------------------
                   BUILD DASHBOARD LOOKUP
                -------------------------------------------------- */

                const latestLookup =
                    Object.create(null);


                for (
                    let i = 0;
                    i < globalDashboardData.length;
                    i++
                ) {

                    const item =
                        globalDashboardData[i];


                    const sym =
                        getSymbol(item);


                    if (sym) {

                        latestLookup[sym] =
                            item;

                    }

                }


                /* -------------------------------------------------
                   BUILD SYMBOL DATA IN ONE PASS
                -------------------------------------------------- */

                const symbolMap =
                    new Map();


                for (
                    let i = 0;
                    i < globalChartRawData.length;
                    i++
                ) {

                    const r =
                        globalChartRawData[i];


                    const date =
                        String(
                            r.Date ?? ""
                        ).trim();


                    if (
                        date !== todayStr
                    ) {

                        continue;

                    }


                    const sym =
                        getSymbol(r);


                    if (!sym) {

                        continue;

                    }


                    if (
                        !symbolMap.has(sym)
                    ) {

                        symbolMap.set(
                            sym,
                            []
                        );

                    }


                    symbolMap
                        .get(sym)
                        .push(r);

                }


                const bullishRows = [];

                const bearishRows = [];


                /* -------------------------------------------------
                   PROCESS EACH SYMBOL
                -------------------------------------------------- */

                symbolMap.forEach(
                    (rows, sym) => {

                        if (
                            rows.length < 5
                        ) {

                            return;

                        }


                        rows.sort(
                            (a, b) =>
                                getTime(a)
                                    .localeCompare(
                                        getTime(b)
                                    )
                        );


                        const volSeries = [];

                        const pcrSeries = [];

                        const ltpSeries = [];


                        for (
                            let i = 0;
                            i < rows.length;
                            i++
                        ) {

                            const r =
                                rows[i];


                            const vol =
                                safeNumber(
                                    r["VOL CPR"] ??
                                    r["Vol CPR"] ??
                                    r["V_CPR"],
                                    NaN
                                );


                            const pcr =
                                safeNumber(
                                    r["OPT PCR"] ??
                                    r["Opt PCR"] ??
                                    r["O_PCR"],
                                    NaN
                                );


                            const ltp =
                                safeNumber(
                                    r["LTP"],
                                    NaN
                                );


                            if (
                                Number.isFinite(vol)
                            ) {

                                volSeries.push(
                                    vol
                                );

                            }


                            if (
                                Number.isFinite(pcr)
                            ) {

                                pcrSeries.push(
                                    pcr
                                );

                            }


                            if (
                                Number.isFinite(ltp)
                            ) {

                                ltpSeries.push(
                                    ltp
                                );

                            }

                        }


                        if (
                            volSeries.length === 0 ||
                            pcrSeries.length === 0 ||
                            ltpSeries.length === 0
                        ) {

                            return;

                        }


                        const firstCount =
                            Math.min(
                                4,
                                volSeries.length
                            );


                        let firstVol = 0;

                        let firstPcr = 0;

                        let firstLtp = 0;


                        for (
                            let i = 0;
                            i < firstCount;
                            i++
                        ) {

                            firstVol +=
                                volSeries[i] || 0;

                            firstPcr +=
                                pcrSeries[i] || 0;

                            firstLtp +=
                                ltpSeries[i] || 0;

                        }


                        firstVol /=
                            firstCount;

                        firstPcr /=
                            firstCount;

                        firstLtp /=
                            firstCount;


                        const lastVol =
                            volSeries[
                                volSeries.length - 1
                            ];


                        const lastPcr =
                            pcrSeries[
                                pcrSeries.length - 1
                            ];


                        const lastLtp =
                            ltpSeries[
                                ltpSeries.length - 1
                            ];


                        if (
                            firstVol === 0 ||
                            !Number.isFinite(firstVol) ||
                            firstLtp === 0 ||
                            !Number.isFinite(firstLtp)
                        ) {

                            return;

                        }


                        let maxVol =
                            -Infinity;

                        let minVol =
                            Infinity;


                        for (
                            let i = 0;
                            i < volSeries.length;
                            i++
                        ) {

                            if (
                                volSeries[i] >
                                maxVol
                            ) {

                                maxVol =
                                    volSeries[i];

                            }


                            if (
                                volSeries[i] <
                                minVol
                            ) {

                                minVol =
                                    volSeries[i];

                            }

                        }


                        const priceMovementPct =
                            Math.abs(
                                (
                                    lastLtp -
                                    firstLtp
                                ) /
                                firstLtp
                            ) * 100;


                        const isPriceStuck =
                            priceMovementPct <=
                            1.5;


                        if (!isPriceStuck) {

                            return;

                        }


                        const info =
                            latestLookup[sym] ||
                            {};


                        const ceCon =
                            safeNumber(
                                info.CE_CON
                            );


                        const peCon =
                            safeNumber(
                                info.PE_CON
                            );


                        const chgPct =
                            safeNumber(
                                info["CHG_%"]
                            );


                        const optPcr =
                            safeNumber(
                                info.O_PCR
                            );


                        const volCpr =
                            safeNumber(
                                info.V_CPR
                            );


                        /* -----------------------------------------
                           BULLISH
                        ------------------------------------------ */

                        const isVolBullish =
                            lastVol >
                                firstVol &&
                            lastVol >=
                                maxVol * 0.75;


                        const isPcrBullish =
                            lastPcr >=
                            firstPcr * 0.90;


                        if (
                            isVolBullish &&
                            isPcrBullish &&
                            ceCon >= 70
                        ) {

                            bullishRows.push(
                                {
                                    sym,
                                    chg: chgPct,
                                    pcr: optPcr,
                                    cpr: volCpr,
                                    ce: ceCon
                                }
                            );

                        }


                        /* -----------------------------------------
                           BEARISH
                        ------------------------------------------ */

                        const isVolBearish =
                            lastVol <
                                firstVol &&
                            (
                                minVol > 0.1
                                    ? lastVol <=
                                      minVol * 1.25
                                    : lastVol <=
                                      0.5
                            );


                        const isPcrBearish =
                            lastPcr <=
                            firstPcr * 1.10;


                        if (
                            isVolBearish &&
                            isPcrBearish &&
                            peCon >= 70
                        ) {

                            bearishRows.push(
                                {
                                    sym,
                                    chg: chgPct,
                                    pcr: optPcr,
                                    cpr: volCpr,
                                    pe: peCon
                                }
                            );

                        }

                    }
                );


                renderTrendTables(
                    bullishRows,
                    bearishRows
                );


            } catch (error) {

                showError(
                    "Trend scanner error: " +
                    error.message
                );

            }

        }


        /* =========================================================
           TREND TABLE RENDER
        ========================================================== */

        function renderTrendTables(
            bullishRows,
            bearishRows
        ) {

            /* -----------------------------------------------------
               BULLISH SORT
            ------------------------------------------------------ */

            bullishRows.sort(
                (a, b) =>
                    b.ce - a.ce
            );


            let bullishHtml = `

                <table class="trend-table text-xs text-center">

                    <thead>
                        <tr class="border-b border-blue-800">

                            <th class="p-2.5">
                                SYMBOL
                            </th>

                            <th class="p-2.5">
                                CHANGE %
                            </th>

                            <th class="p-2.5">
                                OPT PCR
                            </th>

                            <th class="p-2.5">
                                VOL CPR
                            </th>

                            <th class="p-2.5">
                                CE CONTRACT
                            </th>

                        </tr>
                    </thead>

                    <tbody>
            `;


            if (
                bullishRows.length === 0
            ) {

                bullishHtml += `

                    <tr>
                        <td
                            colspan="5"
                            class="p-6 text-slate-400"
                        >
                            No Bullish Stocks Matched
                        </td>
                    </tr>

                `;

            } else {

                for (
                    let i = 0;
                    i < bullishRows.length;
                    i++
                ) {

                    const r =
                        bullishRows[i];


                    bullishHtml += `

                        <tr class="border-b border-slate-200 dark:border-slate-800">

                            <td class="p-2.5 font-bold">
                                ${escapeHtml(r.sym)}
                            </td>

                            <td class="p-2.5 text-green-600 dark:text-green-400 font-bold">
                                ${r.chg >= 0 ? "+" : ""}
                                ${r.chg.toFixed(2)}%
                            </td>

                            <td class="p-2.5">
                                ${r.pcr.toFixed(2)}
                            </td>

                            <td class="p-2.5">
                                ${r.cpr.toFixed(2)}
                            </td>

                            <td class="p-2.5 text-green-600 dark:text-green-400 font-bold">
                                +${r.ce.toFixed(1)}%
                            </td>

                        </tr>

                    `;

                }

            }


            bullishHtml += `
                    </tbody>
                </table>
            `;


            document
                .getElementById(
                    "subtab-bullish"
                )
                .innerHTML =
                bullishHtml;


            /* -----------------------------------------------------
               BEARISH SORT
            ------------------------------------------------------ */

            bearishRows.sort(
                (a, b) =>
                    b.pe - a.pe
            );


            let bearishHtml = `

                <table class="trend-table text-xs text-center">

                    <thead>
                        <tr class="border-b border-blue-800">

                            <th class="p-2.5">
                                SYMBOL
                            </th>

                            <th class="p-2.5">
                                CHANGE %
                            </th>

                            <th class="p-2.5">
                                OPT PCR
                            </th>

                            <th class="p-2.5">
                                VOL CPR
                            </th>

                            <th class="p-2.5">
                                PE CONTRACT
                            </th>

                        </tr>
                    </thead>

                    <tbody>
            `;


            if (
                bearishRows.length === 0
            ) {

                bearishHtml += `

                    <tr>
                        <td
                            colspan="5"
                            class="p-6 text-slate-400"
                        >
                            No Bearish Stocks Matched
                        </td>
                    </tr>

                `;

            } else {

                for (
                    let i = 0;
                    i < bearishRows.length;
                    i++
                ) {

                    const r =
                        bearishRows[i];


                    bearishHtml += `

                        <tr class="border-b border-slate-200 dark:border-slate-800">

                            <td class="p-2.5 font-bold">
                                ${escapeHtml(r.sym)}
                            </td>

                            <td class="p-2.5 text-red-600 dark:text-red-400 font-bold">
                                ${r.chg.toFixed(2)}%
                            </td>

                            <td class="p-2.5">
                                ${r.pcr.toFixed(2)}
                            </td>

                            <td class="p-2.5">
                                ${r.cpr.toFixed(2)}
                            </td>

                            <td class="p-2.5 text-red-600 dark:text-red-400 font-bold">
                                +${r.pe.toFixed(1)}%
                            </td>

                        </tr>

                    `;

                }

            }


            bearishHtml += `
                    </tbody>
                </table>
            `;


            document
                .getElementById(
                    "subtab-bearish"
                )
                .innerHTML =
                bearishHtml;

        }


        /* =========================================================
           DASHBOARD RENDER
        ========================================================== */

        function renderDashboard() {

            const toggle =
                document.getElementById(
                    "show-pct-toggle"
                );


            const showPct =
                toggle
                    ? toggle.checked
                    : true;


            const tbody =
                document.getElementById(
                    "table-body"
                );


            if (
                globalDashboardData.length === 0
            ) {

                tbody.innerHTML = `

                    <tr>
                        <td
                            colspan="12"
                            class="text-center p-8 text-slate-400"
                        >
                            ⏳ Waiting for Firebase data...
                        </td>
                    </tr>

                `;

                return;

            }


            /* -----------------------------------------------------
               SORT BY CONTRACT STRENGTH
            ------------------------------------------------------ */

            const sortedData =
                [...globalDashboardData]
                    .sort(
                        (a, b) => {

                            const aValue =
                                Math.abs(
                                    safeNumber(
                                        a.CE_CON
                                    )
                                ) +
                                Math.abs(
                                    safeNumber(
                                        a.PE_CON
                                    )
                                );


                            const bValue =
                                Math.abs(
                                    safeNumber(
                                        b.CE_CON
                                    )
                                ) +
                                Math.abs(
                                    safeNumber(
                                        b.PE_CON
                                    )
                                );


                            return (
                                bValue -
                                aValue
                            );

                        }
                    );


            const fragment =
                document.createDocumentFragment();


            /* -----------------------------------------------------
               BUILD ROWS
            ------------------------------------------------------ */

            for (
                let i = 0;
                i < sortedData.length;
                i++
            ) {

                const item =
                    sortedData[i];


                const row =
                    document.createElement(
                        "tr"
                    );


                const openStatus =
                    String(
                        item.OPEN_STATUS ??
                        ""
                    );


                const chgPct =
                    safeNumber(
                        item["CHG_%"]
                    );


                const ltpChg =
                    safeNumber(
                        item.LTP_CH
                    );


                const ce =
                    safeNumber(
                        item.CE_CON
                    );


                const pe =
                    safeNumber(
                        item.PE_CON
                    );


                const vPcr =
                    safeNumber(
                        item.V_PCR
                    );


                const oPcr =
                    safeNumber(
                        item.O_PCR
                    );


                const vCpr =
                    safeNumber(
                        item.V_CPR
                    );


                const ltp =
                    safeNumber(
                        item.LTP
                    );


                const pcrVal =
                    showPct
                        ? safeNumber(
                            item.PCR_PCT
                        )
                        : safeNumber(
                            item.PCR_ABS
                        );


                const volVal =
                    showPct
                        ? safeNumber(
                            item.VOL_PCT
                        )
                        : safeNumber(
                            item.VOL_ABS
                        );


                const openColor =
                    openStatus.includes(
                        "Gap Up"
                    )
                        ? "#00AA00"
                        : openStatus.includes(
                            "Gap Down"
                        )
                            ? "#FF0000"
                            : "#00BFFF";


                const chgColor =
                    chgPct > 0
                        ? "#00AA00"
                        : chgPct < 0
                            ? "#FF0000"
                            : "#888888";


                const ltpChgColor =
                    ltpChg > 0
                        ? "#00AA00"
                        : ltpChg < 0
                            ? "#FF0000"
                            : "#888888";


                const ceColor =
                    ce > 0
                        ? "#00AA00"
                        : ce < 0
                            ? "#FF0000"
                            : "#888888";


                const peColor =
                    pe > 0
                        ? "#00AA00"
                        : pe < 0
                            ? "#FF0000"
                            : "#888888";


                const vPcrColor =
                    vPcr >= 1
                        ? "#00AA00"
                        : "#FF0000";


                const oPcrColor =
                    oPcr >= 1
                        ? "#00AA00"
                        : "#FF0000";


                const vCprColor =
                    vCpr >= 1
                        ? "#00AA00"
                        : "#FF0000";


                const pcrColor =
                    pcrVal >= 0
                        ? "#00AA00"
                        : "#FF0000";


                const volColor =
                    volVal >= 0
                        ? "#00AA00"
                        : "#FF0000";


                row.innerHTML = `

                    <td class="p-3 text-center font-bold">
                        ${escapeHtml(
                            getSymbol(item)
                        )}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${openColor}"
                    >
                        ${escapeHtml(
                            openStatus
                        )}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${vPcrColor}"
                    >
                        ${vPcr.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${oPcrColor}"
                    >
                        ${oPcr.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${vCprColor}"
                    >
                        ${vCpr.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${ltpChgColor}"
                    >
                        ${ltpChg >= 0 ? "+" : ""}
                        ${ltpChg.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${chgColor}"
                    >
                        ${chgPct >= 0 ? "+" : ""}
                        ${chgPct.toFixed(2)}%
                    </td>


                    <td class="p-3 text-center font-bold">
                        ${ltp.toFixed(2)}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${ceColor}"
                    >
                        ${ce >= 0 ? "+" : ""}
                        ${ce.toFixed(1)}%
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${peColor}"
                    >
                        ${pe >= 0 ? "+" : ""}
                        ${pe.toFixed(1)}%
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${pcrColor}"
                    >
                        ${pcrVal.toFixed(2)}
                        ${showPct ? "%" : ""}
                    </td>


                    <td
                        class="p-3 text-center font-bold"
                        style="color:${volColor}"
                    >
                        ${volVal.toFixed(2)}
                        ${showPct ? "%" : ""}
                    </td>

                `;


                fragment.appendChild(
                    row
                );

            }


            tbody.innerHTML = "";

            tbody.appendChild(
                fragment
            );

        }


        /* =========================================================
           TABLE SORTING
        ========================================================== */

        function sortTable(columnIndex) {

            const table =
                document.querySelector(
                    ".dashboard-table"
                );


            if (!table) return;


            const tbody =
                table.querySelector(
                    "tbody"
                );


            const rows =
                Array.from(
                    tbody.querySelectorAll(
                        "tr"
                    )
                );


            if (
                rows.length === 0
            ) {

                return;

            }


            sortDirections[columnIndex] =
                !sortDirections[columnIndex];


            const asc =
                sortDirections[columnIndex];


            rows.sort(
                (rowA, rowB) => {

                    const cellA =
                        rowA.cells[columnIndex];


                    const cellB =
                        rowB.cells[columnIndex];


                    if (!cellA || !cellB) {

                        return 0;

                    }


                    const textA =
                        cellA.innerText
                            .replace(
                                /[%+,]/g,
                                ""
                            )
                            .trim();


                    const textB =
                        cellB.innerText
                            .replace(
                                /[%+,]/g,
                                ""
                            )
                            .trim();


                    const numA =
                        parseFloat(
                            textA
                        );


                    const numB =
                        parseFloat(
                            textB
                        );


                    if (
                        Number.isFinite(numA) &&
                        Number.isFinite(numB)
                    ) {

                        return asc
                            ? numA - numB
                            : numB - numA;

                    }


                    return asc
                        ? textA.localeCompare(
                            textB
                        )
                        : textB.localeCompare(
                            textA
                        );

                }
            );


            const fragment =
                document.createDocumentFragment();


            rows.forEach(
                row =>
                    fragment.appendChild(
                        row
                    )
            );


            tbody.innerHTML = "";

            tbody.appendChild(
                fragment
            );

        }


        /* =========================================================
           KEEP CHART RESPONSIVE AFTER ROTATION / RESIZE
        ========================================================== */

        let resizeTimer = null;


        window.addEventListener(
            "resize",
            function() {

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        () => {

                            if (
                                apexChartInstance &&
                                !document
                                    .getElementById(
                                        "view-chart"
                                    )
                                    .classList
                                    .contains(
                                        "hidden"
                                    )
                            ) {

                                updateChartData(
                                    true
                                );

                            }

                        },
                        350
                    );

            }
        );


        /* =========================================================
           INITIAL STATUS
        ========================================================== */

        setFirebaseStatus(false);


        /* =========================================================
           PREVENT ACCIDENTAL DOUBLE TOUCH / ZOOM ISSUES
        ========================================================== */

        document.addEventListener(
            "touchstart",
            function() {},
            { passive: true }
        );


        /* =========================================================
           INITIAL DASH TAB
        ========================================================== */

        switchTab("dash");


    </script>
