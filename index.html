<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>F&O Pro Trading Dashboard</title>

    <!-- =========================================================
         TAILWIND
    ========================================================== -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>

    <!-- =========================================================
         APEXCHARTS
    ========================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!-- =========================================================
         NO UI SLIDER
    ========================================================== -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css"
        rel="stylesheet"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>

    <!-- =========================================================
         FIREBASE
    ========================================================== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeSpeed;
        }

        button,
        select,
        input {
            font-family: inherit;
        }

        /* =====================================================
           TABLE
        ====================================================== */

        .dashboard-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
        }

        .dashboard-table {
            min-width: 1250px;
            width: 100%;
            border-collapse: collapse;
        }

        .dashboard-table th {
            position: sticky !important;
            top: 0 !important;
            z-index: 20 !important;

            background: #172554 !important;
            color: #ffffff !important;

            cursor: pointer;
            user-select: none;

            white-space: nowrap;
        }

        .dashboard-table td {
            white-space: nowrap;
        }

        .dashboard-table tbody tr {
            transition: background-color 0.1s ease;
        }

        .dashboard-table tbody tr:hover {
            background-color: rgba(59, 130, 246, 0.06);
        }

        /* =====================================================
           TREND TABLE
        ====================================================== */

        .trend-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .trend-table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        .trend-table th {
            background: #172554 !important;
            color: white !important;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .trend-table td {
            white-space: nowrap;
        }

        /* =====================================================
           CHART
        ====================================================== */

        #apex-chart-container {
            width: 100%;
            min-height: 420px;
            touch-action: pan-y;
            overflow: hidden;
        }

        /* =====================================================
           SLIDER
        ====================================================== */

        .noUi-target,
        .noUi-handle {
            touch-action: none !important;
        }

        .noUi-target {
            background: #cbd5e1;
            border: none;
            box-shadow: none;
            height: 8px;
        }

        .noUi-connect {
            background: #2962FF;
        }

        .noUi-handle {
            width: 24px !important;
            height: 24px !important;
            border-radius: 50%;
            background: #2962FF;
            border: none;
            right: -12px !important;
            top: -8px !important;
            cursor: pointer;
            box-shadow: 0 2px 7px rgba(0,0,0,0.3);
        }

        .noUi-handle:before,
        .noUi-handle:after {
            display: none;
        }

        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 640px) {

            body {
                padding: 8px !important;
            }

            #top-control-bar {
                padding: 10px !important;
                gap: 8px !important;
            }

            #tab-buttons {
                width: 100%;
                overflow-x: auto;
                justify-content: flex-start;
            }

            #tab-buttons button {
                flex: 0 0 auto;
            }

            #right-controls {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 6px;
            }

            #right-controls > div,
            #right-controls > button {
                width: 100%;
                justify-content: center;
            }

            .dashboard-table {
                min-width: 1250px;
            }

            .dashboard-table th,
            .dashboard-table td {
                padding: 10px 9px !important;
                font-size: 11px !important;
            }

            #view-chart {
                padding: 10px !important;
            }

            #apex-chart-container {
                min-height: 390px;
            }

            #view-trend {
                padding: 10px !important;
            }

            .trend-table th,
            .trend-table td {
                padding: 9px !important;
                font-size: 11px !important;
            }
        }

        /* =====================================================
           ERROR BOX
        ====================================================== */

        #error-box {
            display: none;
        }

        /* =====================================================
           FIREBASE STATUS DOT
        ====================================================== */

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-online {
            background: #22c55e;
            box-shadow: 0 0 7px rgba(34,197,94,0.7);
        }

        .status-offline {
            background: #ef4444;
            box-shadow: 0 0 7px rgba(239,68,68,0.7);
        }

    </style>
</head>


<body
    id="body-tag"
    class="p-2 sm:p-4 bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200"
>


    <!-- =========================================================
         ERROR BOX
    ========================================================== -->

    <div
        id="error-box"
        class="w-full mb-3 bg-red-50 dark:bg-red-950/40 border border-red-300 dark:border-red-800 text-red-700 dark:text-red-300 rounded-xl p-3 text-xs font-bold"
    >
    </div>


    <!-- =========================================================
         TOP CONTROL BAR
    ========================================================== -->

    <div
        id="top-control-bar"
        class="w-full flex flex-wrap justify-between items-center mb-4 bg-white dark:bg-slate-900 p-2 sm:p-3 rounded-xl shadow-lg border border-slate-200 dark:border-slate-800 gap-2"
    >

        <!-- TABS -->

        <div
            id="tab-buttons"
            class="flex space-x-1 bg-slate-100 dark:bg-slate-950 p-1 rounded-lg border border-slate-200 dark:border-slate-800"
        >

            <button
                onclick="switchTab('dash')"
                id="btn-dash"
                class="px-4 py-2 rounded-md text-xs sm:text-sm font-bold bg-blue-600 text-white transition"
            >
                📊 Dash
            </button>

            <button
                onclick="switchTab('chart')"
                id="btn-chart"
                class="px-4 py-2 rounded-md text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition"
            >
                📈 CHART
            </button>

            <button
                onclick="switchTab('trend')"
                id="btn-trend"
                class="px-4 py-2 rounded-md text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition"
            >
                🚀 TREND
            </button>

        </div>


        <!-- RIGHT CONTROLS -->

        <div
            id="right-controls"
            class="flex items-center space-x-2 sm:space-x-3"
        >

            <!-- TIME -->

            <div
                id="time-box-container"
                class="border border-slate-200 dark:border-slate-800 px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-950 text-cyan-600 dark:text-cyan-400 font-bold text-xs sm:text-sm"
            >
                ⏱️ <span id="live-time">Waiting...</span>
            </div>


            <!-- FIREBASE STATUS -->

            <div
                id="firebase-status"
                class="border border-slate-200 dark:border-slate-800 px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-950 text-xs font-bold"
            >
                <span
                    id="firebase-dot"
                    class="status-dot status-offline"
                ></span>

                <span id="firebase-status-text">
                    Connecting
                </span>
            </div>


            <!-- SHOW PERCENT -->

            <div
                id="toggle-container"
                class="flex items-center space-x-2 bg-slate-50 dark:bg-slate-950 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-800"
            >

                <span class="text-xs font-bold text-red-500">
                    SHOW %
                </span>

                <input
                    type="checkbox"
                    id="show-pct-toggle"
                    checked
                    onchange="renderDashboard()"
                    class="w-5 h-5 accent-red-500 cursor-pointer"
                >

            </div>


            <!-- THEME -->

            <button
                onclick="toggleTheme()"
                id="theme-btn"
                class="px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-bold text-amber-500 transition shadow-sm"
            >
                ☀️ Light
            </button>

        </div>

    </div>


    <!-- =========================================================
         VIEW 1 : DASHBOARD
    ========================================================== -->

    <div
        id="view-dash"
        class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-2xl overflow-hidden"
    >

        <div
            class="dashboard-scroll max-h-[80vh]"
        >

            <table
                class="dashboard-table text-left text-xs sm:text-sm"
            >

                <thead>
                    <tr class="text-white border-b border-blue-900">

                        <th onclick="sortTable(0)" class="p-3 text-center">
                            SYMBOL ↕
                        </th>

                        <th onclick="sortTable(1)" class="p-3 text-center">
                            OPENING ↕
                        </th>

                        <th onclick="sortTable(2)" class="p-3 text-center">
                            VOL PCR ↕
                        </th>

                        <th onclick="sortTable(3)" class="p-3 text-center">
                            OPTION PCR ↕
                        </th>

                        <th onclick="sortTable(4)" class="p-3 text-center">
                            VOL CPR ↕
                        </th>

                        <th onclick="sortTable(5)" class="p-3 text-center">
                            LTP CHANGE ↕
                        </th>

                        <th onclick="sortTable(6)" class="p-3 text-center">
                            CHANGE % ↕
                        </th>

                        <th onclick="sortTable(7)" class="p-3 text-center">
                            LTP ↕
                        </th>

                        <th onclick="sortTable(8)" class="p-3 text-center">
                            CE CONTRACT ↕
                        </th>

                        <th onclick="sortTable(9)" class="p-3 text-center">
                            PE CONTRACT ↕
                        </th>

                        <th
                            id="col-checker-header"
                            onclick="sortTable(10)"
                            class="p-3 text-center"
                        >
                            PCR CHECKER ↕
                        </th>

                        <th
                            id="col-vol-checker-header"
                            onclick="sortTable(11)"
                            class="p-3 text-center"
                        >
                            VOL CHECKER ↕
                        </th>

                    </tr>
                </thead>


                <tbody
                    id="table-body"
                    class="divide-y divide-slate-200 dark:divide-slate-800 font-semibold"
                >

                    <tr>
                        <td
                            colspan="12"
                            class="text-center p-8 text-slate-400"
                        >
                            ⏳ Loading Data from Firebase...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <!-- =========================================================
         VIEW 2 : PROFESSIONAL CHART
    ========================================================== -->

    <div
        id="view-chart"
        class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 sm:p-6 hidden shadow-2xl"
    >

        <div
            class="flex flex-wrap justify-between items-center mb-4 gap-2"
        >

            <select
                id="stock-select"
                onchange="updateChartData(true)"
                class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-white font-bold text-sm rounded-lg px-3 py-2 w-full sm:w-64 focus:outline-none focus:border-blue-500"
            >

                <option value="">
                    Select Stock...
                </option>

            </select>


            <div
                class="flex space-x-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border border-slate-300 dark:border-slate-700"
            >

                <button
                    onclick="setChartMode('Vol CPR')"
                    id="mode-vol"
                    class="px-3 py-1.5 rounded-md text-xs font-bold bg-red-600 text-white transition"
                >
                    Vol CPR
                </button>

                <button
                    onclick="setChartMode('OPT PCR')"
                    id="mode-opt"
                    class="px-3 py-1.5 rounded-md text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition"
                >
                    OPT PCR
                </button>

            </div>


            <button
                onclick="resetChartZoom()"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-3 py-2 rounded-lg transition shadow"
            >
                🔄 Reset Zoom
            </button>

        </div>


        <div
            id="apex-chart-container"
            class="w-full"
        ></div>


        <div class="mt-6 px-2 sm:px-4">

            <div
                class="flex justify-between text-xs font-bold text-slate-500 dark:text-slate-400 mb-3"
            >

                <span id="lbl-start">
                    From: --:--
                </span>

                <span id="lbl-end">
                    To: --:--
                </span>

            </div>


            <div id="html-slider"></div>

        </div>

    </div>


    <!-- =========================================================
         VIEW 3 : TREND SCANNER
    ========================================================== -->

    <div
        id="view-trend"
        class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 hidden shadow-2xl"
    >

        <h2
            class="text-lg font-bold text-cyan-600 dark:text-cyan-400 mb-4"
        >
            🚀 Divergence Trend Scanner
        </h2>


        <div
            class="flex space-x-2 mb-4 border-b border-slate-200 dark:border-slate-800 pb-2 overflow-x-auto"
        >

            <button
                onclick="switchTrendSubTab('bullish')"
                id="btn-sub-bull"
                class="px-4 py-2 rounded-lg text-xs font-bold bg-green-600 text-white transition whitespace-nowrap"
            >
                🟢 Bullish Stocks
            </button>

            <button
                onclick="switchTrendSubTab('bearish')"
                id="btn-sub-bear"
                class="px-4 py-2 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-400 transition whitespace-nowrap"
            >
                🔴 Bearish Stocks
            </button>

        </div>


        <div
            id="subtab-bullish"
            class="trend-scroll max-h-[600px]"
        >
            <p class="text-slate-400 text-xs text-center p-4">
                Waiting for data...
            </p>
        </div>


        <div
            id="subtab-bearish"
            class="trend-scroll max-h-[600px] hidden"
        >
            <p class="text-slate-400 text-xs text-center p-4">
                Waiting for data...
            </p>
        </div>

    </div>



    <script>

        /* =========================================================
           GLOBAL CONFIG
        ========================================================== */

        const FIREBASE_URL =
            "https://fyers-bot-606b9-default-rtdb.firebaseio.com";


        /* =========================================================
           FIREBASE INIT
        ========================================================== */

        let firebaseApp;

        try {

            firebaseApp = firebase.initializeApp({
                databaseURL: FIREBASE_URL
            });

        } catch (error) {

            showError(
                "Firebase initialization failed: " + error.message
            );

        }


        const db = firebase.database();


        /* =========================================================
           GLOBAL DATA
        ========================================================== */

        let globalDashboardData = [];

        let globalChartRawData = [];

        let currentChartMode = "Vol CPR";

        let apexChartInstance = null;

        let sliderInstance = null;

        let currentActiveStock = "";

        let currentActiveMode = "";

        let cachedTimeCategories = [];

        let cachedIndicatorValues = [];

        let cachedLtpValues = [];

        let sortDirections = {};

        let trendTimer = null;

        let chartTimer = null;


        /* =========================================================
           UTILITY
        ========================================================== */

        function safeNumber(value, fallback = 0) {

            const n = parseFloat(value);

            return Number.isFinite(n)
                ? n
                : fallback;

        }


        function getSymbol(item) {

            return String(
                item?.SYMS ??
                item?.SYMBOL ??
                item?.Symbol ??
                ""
            ).trim();

        }


        function getTime(item) {

            return String(
                item?.Time ??
                ""
            ).trim();

        }


        function getISTDateStr() {

            const now = new Date();

            const istString = now.toLocaleString(
                "en-US",
                {
                    timeZone: "Asia/Kolkata"
                }
            );

            const ist = new Date(istString);

            const yr = ist.getFullYear();

            const mo = String(
                ist.getMonth() + 1
            ).padStart(2, "0");

            const da = String(
                ist.getDate()
            ).padStart(2, "0");

            return `${yr}-${mo}-${da}`;

        }


        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================================
           ERROR HANDLING
        ========================================================== */

        function showError(message) {

            console.error(message);

            const box =
                document.getElementById("error-box");

            if (!box) return;

            box.style.display = "block";

            box.innerHTML =
                "⚠️ " +
                escapeHtml(message);

        }


        function hideError() {

            const box =
                document.getElementById("error-box");

            if (!box) return;

            box.style.display = "none";

        }


        window.addEventListener(
            "error",
            function(event) {

                showError(
                    "JavaScript Error: " +
                    event.message
                );

            }
        );


        window.addEventListener(
            "unhandledrejection",
            function(event) {

                showError(
                    "Script Error: " +
                    String(event.reason)
                );

            }
        );


        /* =========================================================
           FIREBASE STATUS
        ========================================================== */

        function setFirebaseStatus(online) {

            const dot =
                document.getElementById("firebase-dot");

            const text =
                document.getElementById("firebase-status-text");

            if (!dot || !text) return;

            if (online) {

                dot.className =
                    "status-dot status-online";

                text.innerText =
                    "Live";

                text.className =
                    "text-green-600 dark:text-green-400";

            } else {

                dot.className =
                    "status-dot status-offline";

                text.innerText =
                    "Offline";

                text.className =
                    "text-red-600 dark:text-red-400";

            }

        }


        db.ref(".info/connected").on(
            "value",
            snapshot => {

                setFirebaseStatus(
                    snapshot.val() === true
                );

            },
            error => {

                setFirebaseStatus(false);

                showError(
                    "Firebase connection error: " +
                    error.message
                );

            }
        );


        /* =========================================================
           THEME
        ========================================================== */

        function toggleTheme() {

            const body =
                document.getElementById("body-tag");

            const btn =
                document.getElementById("theme-btn");


            if (body.classList.contains("dark")) {

                body.classList.remove("dark");

                btn.innerText =
                    "☀️ Light";

                btn.className =
                    "px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-xs font-bold text-amber-500 transition shadow-sm";

            } else {

                body.classList.add("dark");

                btn.innerText =
                    "🌙 Dark";

                btn.className =
                    "px-3 py-2 rounded-lg border border-slate-800 bg-slate-950 text-xs font-bold text-yellow-400 transition shadow-sm";

            }


            if (
                !document
                    .getElementById("view-chart")
                    .classList
                    .contains("hidden")
            ) {

                updateChartData(true);

            }

        }


        /* =========================================================
           FIREBASE : DASHBOARD
        ========================================================== */

        db.ref("Dashboard/Latest").on(

            "value",

            snapshot => {

                try {

                    const val =
                        snapshot.val();

                    if (!val) {

                        return;

                    }


                    if (val.time) {

                        const date =
                            new Date(
                                Number(val.time) * 1000
                            );

                        document
                            .getElementById("live-time")
                            .innerText =
                            date.toLocaleTimeString(
                                "en-IN",
                                {
                                    hour: "2-digit",
                                    minute: "2-digit",
                                    second: "2-digit"
                                }
                            );

                    }


                    const incoming =
                        Array.isArray(val.data)
                            ? val.data
                            : [];


                    globalDashboardData =
                        incoming;


                    hideError();

                    renderDashboard();

                    populateStockDropdown();

                    scheduleTrendScanner();

                } catch (error) {

                    showError(
                        "Dashboard data error: " +
                        error.message
                    );

                }

            },

            error => {

                showError(
                    "Unable to read Dashboard/Latest: " +
                    error.message
                );

            }

        );


        /* =========================================================
           FIREBASE : CHART HISTORY
        ========================================================== */

        db.ref("ChartHistory").on(

            "value",

            snapshot => {

                try {

                    const val =
                        snapshot.val();

                    if (!val) {

                        globalChartRawData = [];

                        return;

                    }


                    const todayPrefix =
                        getISTDateStr()
                            .replace(/-/g, "");


                    const rows = [];


                    Object.keys(val).forEach(key => {

                        if (
                            !key.startsWith(
                                todayPrefix
                            )
                        ) {

                            return;

                        }


                        const entry =
                            val[key];


                        if (
                            entry &&
                            Array.isArray(entry.data)
                        ) {

                            for (
                                let i = 0;
                                i < entry.data.length;
                                i++
                            ) {

                                rows.push(
                                    entry.data[i]
                                );

                            }

                        }

                    });


                    globalChartRawData =
                        rows;


                    if (
                        !document
                            .getElementById("view-chart")
                            .classList
                            .contains("hidden")
                    ) {

                        scheduleChartUpdate(false);

                    }


                    scheduleTrendScanner();

                } catch (error) {

                    showError(
                        "Chart history error: " +
                        error.message
                    );

                }

            },

            error => {

                showError(
                    "Unable to read ChartHistory: " +
                    error.message
                );

            }

        );


        /* =========================================================
           TAB SWITCH
        ========================================================== */

        function switchTab(tab) {

            const tabs =
                ["dash", "chart", "trend"];


            tabs.forEach(t => {

                const view =
                    document.getElementById(
                        `view-${t}`
                    );

                const btn =
                    document.getElementById(
                        `btn-${t}`
                    );


                view.classList.add("hidden");


                btn.className =
                    "px-4 py-2 rounded-md text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition";

            });


            const selectedView =
                document.getElementById(
                    `view-${tab}`
                );

        /* =========================================================
           STOCK DROPDOWN
        ========================================================== */

        function populateStockDropdown() {

            const select =
                document.getElementById(
                    "stock-select"
                );


            const currentSelected =
                select.value;


            const symbolSet =
                new Set();


            for (
                let i = 0;
                i < globalDashboardData.length;
                i++
            ) {

                const sym =
                    getSymbol(
                        globalDashboardData[i]
                    );

                if (sym) {

                    symbolSet.add(sym);

                }

            }


            if (symbolSet.size === 0) {

                for (
                    let i = 0;
                    i < globalChartRawData.length;
                    i++
                ) {

                    const sym =
                        getSymbol(
                            globalChartRawData[i]
                        );

                    if (sym) {

                        symbolSet.add(sym);

                    }

                }

            }


            if (symbolSet.size === 0) {

                return;

            }


            const symbols =
                Array.from(symbolSet)
                    .sort();


            const fragment =
                document.createDocumentFragment();


            for (
                let i = 0;
                i < symbols.length;
                i++
            ) {

                const opt =
                    document.createElement(
                        "option"
                    );

                opt.value =
                    symbols[i];

                opt.innerText =
                    symbols[i];

                fragment.appendChild(
                    opt
                );

            }


            select.innerHTML = "";

            select.appendChild(
                fragment
            );


            if (
                currentSelected &&
                symbols.includes(
                    currentSelected
                )
            ) {

                select.value =
                    currentSelected;

            } else {

                select.value =
                    symbols[0];

            }

        }

        /* =========================================================
           UPDATE CHART DATA
        ========================================================== */

        function updateChartData(forceRebuild = false) {

            const chartView =
                document.getElementById(
                    "view-chart"
                );


            if (
                chartView.classList.contains(
                    "hidden"
                )
            ) {

                return;

            }


            const selectedStock =
                document.getElementById(
                    "stock-select"
                ).value;


            if (!selectedStock) {

                return;

            }


            const todayStr =
                getISTDateStr();


            const timeMap =
                new Map();


            /* -----------------------------------------------------
               FILTER + MERGE IN ONE PASS
            ------------------------------------------------------ */

            for (
                let i = 0;
                i < globalChartRawData.length;
                i++
            ) {

                const r =
                    globalChartRawData[i];


                const d =
                    String(
                        r.Date ?? ""
                    ).trim();


                const s =
                    getSymbol(r);


                const t =
                    getTime(r);


                if (
                    d !== todayStr ||
                    s !== selectedStock ||
                    t < "09:00" ||
                    t === "--:--"
                ) {

                    continue;

                }


                if (!timeMap.has(t)) {

                    timeMap.set(
                        t,
                        {
                            Time: t,
                            "Vol CPR": null,
                            "OPT PCR": null,
                            "LTP": null
                        }
                    );

                }


                const obj =
                    timeMap.get(t);


                const vCpr =
                    r["VOL CPR"] ??
                    r["Vol CPR"] ??
                    r["V_CPR"] ??
                    r["VOL_CPR"];


                const oPcr =
                    r["OPT PCR"] ??
                    r["Opt PCR"] ??
                    r["O_PCR"] ??
                    r["OPT_PCR"];


                const ltp =
                    r["LTP"] ??
                    r["ltp"];


                if (
                    vCpr !== undefined &&
                    vCpr !== null &&
                    vCpr !== ""
                ) {

                    const n =
                        parseFloat(vCpr);

                    if (
                        Number.isFinite(n)
                    ) {

                        obj["Vol CPR"] =
                            n;

                    }

                }


                if (
                    oPcr !== undefined &&
                    oPcr !== null &&
                    oPcr !== ""
                ) {

                    const n =
                        parseFloat(oPcr);

                    if (
                        Number.isFinite(n)
                    ) {

                        obj["OPT PCR"] =
                            n;

                    }

                }


                if (
                    ltp !== undefined &&
                    ltp !== null &&
                    ltp !== ""
                ) {

                    const n =
                        parseFloat(ltp);

                    if (
                        Number.isFinite(n)
                    ) {

                        obj["LTP"] =
                            n;

                    }

                }

            }


            let df =
                Array.from(
                    timeMap.values()
                );


            df.sort(
                (a, b) =>
                    a.Time.localeCompare(
                        b.Time
                    )
            );


            /* -----------------------------------------------------
               FORWARD FILL
            ------------------------------------------------------ */

            let lastVol = null;

            let lastOpt = null;

            let lastLtp = null;


            for (
                let i = 0;
                i < df.length;
                i++
            ) {

                const r =
                    df[i];


                if (
                    r["Vol CPR"] !== null
                ) {

                    lastVol =
                        r["Vol CPR"];

                } else {

                    r["Vol CPR"] =
                        lastVol;

                }


                if (
                    r["OPT PCR"] !== null
                ) {

                    lastOpt =
                        r["OPT PCR"];

                } else {

                    r["OPT PCR"] =
                        lastOpt;

                }


                if (
                    r["LTP"] !== null
                ) {

                    lastLtp =
                        r["LTP"];

                } else {

                    r["LTP"] =
                        lastLtp;

                }

            }


            /* -----------------------------------------------------
               REMOVE EMPTY START
            ------------------------------------------------------ */

            df =
                df.filter(
                    r => {

                        const target =
                            currentChartMode === "Vol CPR"
                                ? r["Vol CPR"]
                                : r["OPT PCR"];


                        return (
                            target !== null &&
                            r["LTP"] !== null
                        );

                    }
                );


            if (df.length === 0) {

                destroyChart();

                document
                    .getElementById(
                        "apex-chart-container"
                    )
                    .innerHTML =
                    `
                    <p class="text-center text-slate-400 font-bold mt-10">
                        Waiting for today's market data...
                    </p>
                    `;

                return;

            }


            const isNew =
                currentActiveStock !== selectedStock ||
                currentActiveMode !== currentChartMode ||
                forceRebuild;


            currentActiveStock =
                selectedStock;

            currentActiveMode =
                currentChartMode;


            cachedTimeCategories =
                df.map(
                    r => r.Time
                );


            cachedIndicatorValues =
                df.map(
                    r =>
                        currentChartMode === "Vol CPR"
                            ? r["Vol CPR"]
                            : r["OPT PCR"]
                );


            cachedLtpValues =
                df.map(
                    r => r.LTP
                );


            setupHtmlSlider(
                cachedTimeCategories,
                isNew
            );


            let sIdx = 0;

            let eIdx =
                cachedTimeCategories.length - 1;


            const sliderEl =
                document.getElementById(
                    "html-slider"
                );


            if (
                sliderEl &&
                sliderEl.noUiSlider
            ) {

                const vals =
                    sliderEl.noUiSlider.get();


                sIdx =
                    parseInt(vals[0]);


                eIdx =
                    parseInt(vals[1]);


                if (
                    !Number.isFinite(sIdx) ||
                    !Number.isFinite(eIdx)
                ) {

                    sIdx = 0;

                    eIdx =
                        cachedTimeCategories.length - 1;

                }

            }


            renderApexChart(
                cachedTimeCategories,
                cachedIndicatorValues,
                cachedLtpValues,
                sIdx,
                eIdx,
                isNew
            );

        }


        /* =========================================================
           DESTROY CHART
        ========================================================== */

        function destroyChart() {

            if (apexChartInstance) {

                try {

                    apexChartInstance.destroy();

                } catch (e) {}

                apexChartInstance =
                    null;

            }

        }


        /* =========================================================
           HTML SLIDER
        ========================================================== */

        function setupHtmlSlider(
            categories,
            isNewStock
        ) {

            const sliderEl =
                document.getElementById(
                    "html-slider"
                );


            if (
                !categories ||
                categories.length === 0
            ) {

                return;

            }


            const maxRange =
                Math.max(
                    1,
                    categories.length - 1
                );


            if (!sliderEl.noUiSlider) {

                noUiSlider.create(
                    sliderEl,
                    {
                        start: [
                            0,
                            maxRange
                        ],

                        connect: true,

                        range: {
                            min: 0,
                            max: maxRange
                        },

                        step: 1,

                        behaviour: "tap-drag"
                    }
                );


                sliderEl.noUiSlider.on(
                    "slide",
                    function(values) {

                        const sIdx =
                            parseInt(values[0]);

                        const eIdx =
                            parseInt(values[1]);


                        updateSliderLabels(
                            categories,
                            sIdx,
                            eIdx
                        );

                    }
                );


                sliderEl.noUiSlider.on(
                    "set",
                    function(values) {

                        const sIdx =
                            parseInt(values[0]);

                        const eIdx =
                            parseInt(values[1]);


                        renderApexChart(
                            cachedTimeCategories,
                            cachedIndicatorValues,
                            cachedLtpValues,
                            sIdx,
                            eIdx,
                            false
                        );

                    }
                );

            } else {

                sliderEl.noUiSlider.updateOptions(
                    {
                        range: {
                            min: 0,
                            max: maxRange
                        }
                    },
                    false
                );


                if (isNewStock) {

                    sliderEl.noUiSlider.set(
                        [0, maxRange]
                    );

                }

            }


            const vals =
                sliderEl.noUiSlider.get();


            updateSliderLabels(
                categories,
                parseInt(vals[0]),
                parseInt(vals[1])
            );

        }


        function updateSliderLabels(
            categories,
            sIdx,
            eIdx
        ) {

            document
                .getElementById(
                    "lbl-start"
                )
                .innerText =
                "From: " +
                (
                    categories[sIdx] ||
                    "--:--"
                );


            document
                .getElementById(
                    "lbl-end"
                )
                .innerText =
                "To: " +
                (
                    categories[eIdx] ||
                    "--:--"
                );

        }


        /* =========================================================
           RENDER APEX CHART
        ========================================================== */

        function renderApexChart(
            categories,
            indicatorVals,
            ltpVals,
            sIdx,
            eIdx,
            forceRebuild
        ) {

            if (
                !categories ||
                categories.length === 0
            ) {

                return;

            }


            sIdx =
                Math.max(
                    0,
                    Math.min(
                        sIdx,
                        categories.length - 1
                    )
                );


            eIdx =
                Math.max(
                    0,
                    Math.min(
                        eIdx,
                        categories.length - 1
                    )
                );


            if (sIdx > eIdx) {

                return;

            }


            const sliceCats =
                categories.slice(
                    sIdx,
                    eIdx + 1
                );


            const sliceInd =
                indicatorVals.slice(
                    sIdx,
                    eIdx + 1
                );


            const sliceLtp =
                ltpVals.slice(
