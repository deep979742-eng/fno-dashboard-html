<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&O Pro Trading Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- ApexCharts & noUiSlider -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        table.dataframe th, th { 
            position: sticky !important; 
            top: 0 !important; 
            z-index: 50 !important; 
            background-color: darkblue !important; 
            color: #ffffff !important; 
            cursor: pointer; 
            user-select: none; 
        }
        /* Mobile Performance Fixes */
        #apex-chart-container { touch-action: pan-y !important; min-height: 440px; }
        .noUi-target, .noUi-handle { touch-action: none !important; }
        .noUi-target { background: #cbd5e1; border: none; box-shadow: none; height: 8px; }
        .noUi-connect { background: #2962FF; }
        .noUi-handle { width: 22px !important; height: 22px !important; border-radius: 50%; background: #2962FF; border: none; right: -11px !important; top: -7px !important; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        .noUi-handle:before, .noUi-handle:after { display: none; }
    </style>
</head>
<body class="p-2 sm:p-4 bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200" id="body-tag">

    <!-- TOP CONTROL BAR -->
    <div class="w-full flex flex-wrap justify-between items-center mb-4 bg-white dark:bg-slate-900 p-2 sm:p-3 rounded-xl shadow-lg border border-slate-200 dark:border-slate-800 gap-2">
        <div class="flex space-x-1 bg-slate-100 dark:bg-slate-950 p-1 rounded-lg border border-slate-200 dark:border-slate-800">
            <button onclick="switchTab('dash')" id="btn-dash" class="px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold bg-blue-600 text-white transition">📊 Dash</button>
            <button onclick="switchTab('chart')" id="btn-chart" class="px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition">📈 CHART</button>
            <button onclick="switchTab('trend')" id="btn-trend" class="px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition">🚀 TREND</button>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-3">
            <div id="time-box-container" class="border border-slate-200 dark:border-slate-800 px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-950 text-cyan-600 dark:text-cyan-400 font-bold text-xs sm:text-sm">
                ⏱️ <span id="live-time">Waiting...</span>
            </div>
            <div id="toggle-container" class="flex items-center space-x-2 bg-slate-50 dark:bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800">
                <span class="text-xs font-bold text-red-500">SHOW %</span>
                <input type="checkbox" id="show-pct-toggle" checked onchange="renderDashboard()" class="w-4 h-4 accent-red-500 cursor-pointer">
            </div>
            <button onclick="toggleTheme()" id="theme-btn" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-xs font-bold text-amber-500 transition shadow-sm">
                ☀️ Light
            </button>
        </div>
    </div>

    <!-- VIEW 1: DASHBOARD TABLE -->
    <div id="view-dash" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-2xl overflow-hidden">
        <div class="overflow-x-auto max-h-[80vh]">
            <table class="w-full text-left border-collapse text-xs sm:text-sm">
                <thead>
                    <tr class="text-white border-b border-blue-900">
                        <th onclick="sortTable(0)" class="p-3 text-center">SYMBOL ↕</th>
                        <th onclick="sortTable(1)" class="p-3 text-center">OPENING ↕</th>
                        <th onclick="sortTable(2)" class="p-3 text-center">VOL PCR ↕</th>
                        <th onclick="sortTable(3)" class="p-3 text-center">OPTION PCR ↕</th>
                        <th onclick="sortTable(4)" class="p-3 text-center">VOL CPR ↕</th>
                        <th onclick="sortTable(5)" class="p-3 text-center">LTP CHANGE ↕</th>
                        <th onclick="sortTable(6)" class="p-3 text-center">CHANGE % ↕</th>
                        <th onclick="sortTable(7)" class="p-3 text-center">LTP ↕</th>
                        <th onclick="sortTable(8)" class="p-3 text-center">CE CONTRACT ↕</th>
                        <th onclick="sortTable(9)" class="p-3 text-center">PE CONTRACT ↕</th>
                        <th id="col-checker-header" onclick="sortTable(10)" class="p-3 text-center">PCR CHECKER ↕</th>
                        <th id="col-vol-checker-header" onclick="sortTable(11)" class="p-3 text-center">VOL CHECKER ↕</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-200 dark:divide-slate-800 font-semibold">
                    <tr><td colspan="12" class="text-center p-8 text-slate-400">⏳ Loading Data from Firebase...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- VIEW 2: PROFESSIONAL CHART -->
    <div id="view-chart" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-3 sm:p-6 hidden shadow-2xl">
        <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <select id="stock-select" onchange="updateChartData(true)" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-white font-bold text-sm rounded-lg px-3 py-2 w-full sm:w-64 focus:outline-none focus:border-blue-500">
                <option value="">Select Stock...</option>
            </select>
            <div class="flex space-x-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border border-slate-300 dark:border-slate-700">
                <button onclick="setChartMode('Vol CPR')" id="mode-vol" class="px-3 py-1.5 rounded-md text-xs font-bold bg-red-600 text-white transition">Vol CPR</button>
                <button onclick="setChartMode('OPT PCR')" id="mode-opt" class="px-3 py-1.5 rounded-md text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition">OPT PCR</button>
            </div>
            <button onclick="resetChartZoom()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-3 py-2 rounded-lg transition shadow">🔄 Reset Zoom</button>
        </div>
        <div id="apex-chart-container" class="w-full"></div>
        <div class="mt-6 px-4">
            <div class="flex justify-between text-xs font-bold text-slate-500 dark:text-slate-400 mb-2">
                <span id="lbl-start">From: --:--</span>
                <span id="lbl-end">To: --:--</span>
            </div>
            <div id="html-slider"></div>
        </div>
    </div>

    <!-- VIEW 3: TREND SCANNER -->
    <div id="view-trend" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 hidden shadow-2xl">
        <h2 class="text-lg font-bold text-cyan-600 dark:text-cyan-400 mb-4">🚀 Divergence Trend Scanner</h2>
        <div class="flex space-x-2 mb-4 border-b border-slate-200 dark:border-slate-800 pb-2">
            <button onclick="switchTrendSubTab('bullish')" id="btn-sub-bull" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-green-600 text-white transition">🟢 Bullish Stocks</button>
            <button onclick="switchTrendSubTab('bearish')" id="btn-sub-bear" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-400 transition">🔴 Bearish Stocks</button>
        </div>
        <div id="subtab-bullish" class="overflow-x-auto max-h-[600px]"><p class="text-slate-400 text-xs text-center p-4">Waiting for data...</p></div>
        <div id="subtab-bearish" class="overflow-x-auto max-h-[600px] hidden"><p class="text-slate-400 text-xs text-center p-4">Waiting for data...</p></div>
    </div>

    <script>
        const FIREBASE_URL = "https://fyers-bot-606b9-default-rtdb.firebaseio.com";
        firebase.initializeApp({ databaseURL: FIREBASE_URL });
        
        let globalDashboardData = [];
        let globalChartRawData = [];
        
        let currentChartMode = 'Vol CPR';
        let apexChartInstance = null;
        let sliderInstance = null;
        let currentActiveStock = "";
        let currentActiveMode = "";
        
        let cachedTimeCategories = [];
        let cachedIndicatorValues = [];
        let cachedLtpValues = [];

        // 1. Get exact Indian Standard Time (IST) Date string (Matches Python %Y-%m-%d)
        function getISTDateStr() {
            let d = new Date();
            let utc = d.getTime() + (d.getTimezoneOffset() * 60000);
            let ist = new Date(utc + (3600000 * 5.5));
            let yr = ist.getFullYear();
            let mo = String(ist.getMonth() + 1).padStart(2, '0');
            let da = String(ist.getDate()).padStart(2, '0');
            return `${yr}-${mo}-${da}`; 
        }

        function toggleTheme() {
            const body = document.getElementById('body-tag');
            const btn = document.getElementById('theme-btn');
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                btn.innerText = "☀️ Light";
                btn.className = "px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-xs font-bold text-amber-500 transition shadow-sm";
            } else {
                body.classList.add('dark');
                btn.innerText = "🌙 Dark";
                btn.className = "px-3 py-1.5 rounded-lg border border-slate-800 bg-slate-950 text-xs font-bold text-yellow-400 transition shadow-sm";
            }
            if (!document.getElementById('view-chart').classList.contains('hidden')) {
                updateChartData(true); 
            }
        }

        firebase.database().ref("Dashboard/Latest").on("value", (snapshot) => {
            const val = snapshot.val();
            if (!val) return;
            document.getElementById("live-time").innerText = new Date(val.time * 1000).toLocaleTimeString();
            globalDashboardData = val.data || [];
            renderDashboard();
            populateStockDropdown();
            runTrendScanner(); 
        });

        // 2. Fetch Data exactly like Python script
        firebase.database().ref("ChartHistory").on("value", (snapshot) => {
            const val = snapshot.val();
            if (!val) return;
            
            let todayPrefix = getISTDateStr().replace(/-/g, ""); // e.g., "20240907"
            let rows = [];
            
            Object.keys(val).forEach(k => {
                if (k.startsWith(todayPrefix)) {
                    if (val[k] && Array.isArray(val[k].data)) {
                        rows = rows.concat(val[k].data);
                    }
                }
            });
            
            globalChartRawData = rows;
            
            if (!document.getElementById('view-chart').classList.contains('hidden')) {
                updateChartData(false);
            }
            runTrendScanner();
        });

        function switchTab(tab) {
            ['dash', 'chart', 'trend'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).className = "px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition";
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).className = "px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold bg-blue-600 text-white transition";
            
            if (tab === 'chart') {
                setTimeout(() => { updateChartData(true); }, 150);
            }
        }

        function switchTrendSubTab(sub) {
            if (sub === 'bullish') {
                document.getElementById('subtab-bullish').classList.remove('hidden');
                document.getElementById('subtab-bearish').classList.add('hidden');
                document.getElementById('btn-sub-bull').className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-green-600 text-white transition";
                document.getElementById('btn-sub-bear').className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-400 transition";
            } else {
                document.getElementById('subtab-bullish').classList.add('hidden');
                document.getElementById('subtab-bearish').classList.remove('hidden');
                document.getElementById('btn-sub-bear').className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white transition";
                document.getElementById('btn-sub-bull').className = "px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-400 transition";
            }
        }

        function populateStockDropdown() {
            const select = document.getElementById("stock-select");
            const currentSelected = select.value;
            let symbols = [];
            
            if (globalDashboardData.length > 0) {
                symbols = globalDashboardData.map(i => i.SYMS || i.SYMBOL).filter(Boolean);
            } else if (globalChartRawData.length > 0) {
                symbols = [...new Set(globalChartRawData.map(i => i.Symbol || i.SYMS || i.SYMBOL).filter(Boolean))];
            }
            
            if (symbols.length === 0) return;
            
            select.innerHTML = "";
            symbols.sort().forEach(sym => {
                let opt = document.createElement("option");
                opt.value = sym;
                opt.innerText = sym;
                select.appendChild(opt);
            });
            
            if (currentSelected && symbols.includes(currentSelected)) {
                select.value = currentSelected;
            } else {
                select.value = symbols[0];
            }
        }

        function setChartMode(mode) {
            currentChartMode = mode;
            if (mode === 'Vol CPR') {
                document.getElementById('mode-vol').className = "px-3 py-1.5 rounded-md text-xs font-bold bg-red-600 text-white transition";
                document.getElementById('mode-opt').className = "px-3 py-1.5 rounded-md text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition";
            } else {
                document.getElementById('mode-opt').className = "px-3 py-1.5 rounded-md text-xs font-bold bg-blue-600 text-white transition";
                document.getElementById('mode-vol').className = "px-3 py-1.5 rounded-md text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-black dark:hover:text-white transition";
            }
            updateChartData(true); 
        }

        function updateChartData(forceRebuild = false) {
            if (document.getElementById('view-chart').classList.contains('hidden')) return;
            
            const selectedStock = document.getElementById("stock-select").value;
            if (!selectedStock) return;

            let todayStr = getISTDateStr();

            // 3. Filter exactly like Python: day_df[day_df['Symbol'] == sel_stock]
            let df_sym_raw = globalChartRawData.filter(r => {
                let d = (r['Date'] || "").toString().trim();
                let s = (r['Symbol'] || r['SYMS'] || "").toString().trim();
                return d === todayStr && s === selectedStock;
            });

            if (df_sym_raw.length === 0) {
                if (apexChartInstance) { apexChartInstance.destroy(); apexChartInstance = null; }
                document.getElementById('apex-chart-container').innerHTML = `<p class="text-center text-slate-400 font-bold mt-10">Waiting for today's market data...</p>`;
                return;
            }

            // 4. SMART MERGE: Combines split LTP and VOL CPR data into single timestamps safely!
            let mergedMap = new Map();
            df_sym_raw.forEach(r => {
                let t = r['Time'] || "--:--";
                if (!mergedMap.has(t)) {
                    mergedMap.set(t, { ...r });
                } else {
                    let existing = mergedMap.get(t);
                    Object.keys(r).forEach(k => {
                        if (r[k] !== null && r[k] !== undefined && r[k] !== "") {
                            existing[k] = r[k];
                        }
                    });
                }
            });

            let df_sym = Array.from(mergedMap.values());
            df_sym.sort((a, b) => (a['Time'] || "").localeCompare(b['Time'] || ""));

            let isNewStockOrMode = (currentActiveStock !== selectedStock || currentActiveMode !== currentChartMode || forceRebuild);
            currentActiveStock = selectedStock;
            currentActiveMode = currentChartMode;

            let targetCol = currentChartMode === 'Vol CPR' ? 'VOL CPR' : 'OPT PCR';

            cachedTimeCategories = df_sym.map(r => r['Time'] || "--:--");
            
            // 5. Fillna(0) Logic to mimic Streamlit Python exact behaviour
            cachedIndicatorValues = df_sym.map(r => {
                let val = parseFloat(r[targetCol]);
                return isNaN(val) ? 0 : val;
            });
            cachedLtpValues = df_sym.map(r => {
                let val = parseFloat(r['LTP']);
                return isNaN(val) ? 0 : val;
            });

            setupHtmlSlider(cachedTimeCategories, isNewStockOrMode);

            let sIdx = 0;
            let eIdx = cachedTimeCategories.length - 1;
            const sliderEl = document.getElementById('html-slider');
            if (sliderEl && sliderEl.noUiSlider) {
                let vals = sliderEl.noUiSlider.get();
                sIdx = parseInt(vals[0]);
                eIdx = parseInt(vals[1]);
            }

            renderApexChart(cachedTimeCategories, cachedIndicatorValues, cachedLtpValues, sIdx, eIdx, isNewStockOrMode);
        }

        function setupHtmlSlider(categories, isNewStock) {
            const sliderEl = document.getElementById('html-slider');
            if (categories.length === 0) return;
            let maxRange = Math.max(1, categories.length - 1);

            if (!sliderEl.noUiSlider) {
                noUiSlider.create(sliderEl, { 
                    start: [0, maxRange], connect: true, range: { 'min': 0, 'max': maxRange }, step: 1 
                });
                
                sliderEl.noUiSlider.on('slide', function (values) {
                    let sIdx = parseInt(values[0]), eIdx = parseInt(values[1]);
                    document.getElementById('lbl-start').innerText = "From: " + (categories[sIdx] || "--:--");
                    document.getElementById('lbl-end').innerText = "To: " + (categories[eIdx] || "--:--");
                });
                
                sliderEl.noUiSlider.on('set', function (values) {
                    let sIdx = parseInt(values[0]), eIdx = parseInt(values[1]);
                    renderApexChart(cachedTimeCategories, cachedIndicatorValues, cachedLtpValues, sIdx, eIdx, false);
                });
            } else {
                sliderEl.noUiSlider.updateOptions({ range: { 'min': 0, 'max': maxRange } }, false);
                if (isNewStock) {
                    sliderEl.noUiSlider.set([0, maxRange]);
                }
            }
            
            let vals = sliderEl.noUiSlider.get();
            document.getElementById('lbl-start').innerText = "From: " + (categories[parseInt(vals[0])] || "--:--");
            document.getElementById('lbl-end').innerText = "To: " + (categories[parseInt(vals[1])] || "--:--");
        }

        function renderApexChart(categories, indicatorVals, ltpVals, sIdx, eIdx, forceRebuild) {
            if (categories.length === 0) return;
            
            sIdx = Math.max(0, Math.min(sIdx, categories.length - 1));
            eIdx = Math.max(0, Math.min(eIdx, categories.length - 1));
            if (sIdx > eIdx) return;
            
            let sliceCats = categories.slice(sIdx, eIdx + 1);
            let sliceInd = indicatorVals.slice(sIdx, eIdx + 1);
            let sliceLtp = ltpVals.slice(sIdx, eIdx + 1);
            
            // Exact colors from Streamlit Code
            let indColor = currentChartMode === 'Vol CPR' ? '#FF4D4D' : '#00BFFF';
            const isDark = document.getElementById('body-tag').classList.contains('dark');
            const container = document.getElementById('apex-chart-container');

            try {
                if (!apexChartInstance || forceRebuild) {
                    if (apexChartInstance) {
                        apexChartInstance.destroy();
                        apexChartInstance = null;
                    }
                    container.innerHTML = ""; 

                    // Exact Streamlit ApexCharts settings (area + smooth)
                    let options = {
                        series: [
                            { name: currentChartMode, type: 'area', data: sliceInd },
                            { name: 'LTP', type: 'line', data: sliceLtp }
                        ],
                        chart: { height: 440, type: 'line', toolbar: { show: false }, zoom: { enabled: false }, animations: { enabled: false }, background: 'transparent' },
                        colors: [indColor, '#00CC66'],
                        stroke: { curve: 'smooth', width: [3, 3] },
                        fill: { type: ['gradient', 'solid'], gradient: { shadeIntensity: 1, opacityFrom: 0.35, opacityTo: 0.05, stops: [0, 100] } },
                        dataLabels: { enabled: false },
                        xaxis: { categories: sliceCats, labels: { style: { colors: isDark ? '#94a3b8' : '#888' }, fontSize: '11px' }, tickAmount: 10 },
                        yaxis: [
                            { title: { text: currentChartMode, style: { color: indColor } }, labels: { style: { colors: indColor } }, decimalsInFloat: 2 },
                            { opposite: true, title: { text: 'LTP', style: { color: '#00CC66' } }, labels: { style: { colors: '#00CC66' } }, decimalsInFloat: 2 }
                        ],
                        tooltip: { shared: true, intersect: false, theme: isDark ? 'dark' : 'light' },
                        legend: { position: 'top', horizontalAlign: 'right', labels: { colors: isDark ? '#fff' : '#000' } },
                        grid: { borderColor: isDark ? '#334155' : '#e2e8f0', strokeDashArray: 3 }
                    };
                    apexChartInstance = new ApexCharts(container, options);
                    apexChartInstance.render();
                } else {
                    apexChartInstance.updateOptions({
                        xaxis: { categories: sliceCats, labels: { style: { colors: isDark ? '#94a3b8' : '#888' }, fontSize: '11px' } },
                        yaxis: [
                            { title: { text: currentChartMode, style: { color: indColor } }, labels: { style: { colors: indColor } }, decimalsInFloat: 2 },
                            { opposite: true, title: { text: 'LTP', style: { color: '#00CC66' } }, labels: { style: { colors: '#00CC66' } }, decimalsInFloat: 2 }
                        ],
                        colors: [indColor, '#00CC66'],
                        grid: { borderColor: isDark ? '#334155' : '#e2e8f0', strokeDashArray: 3 },
                        tooltip: { theme: isDark ? 'dark' : 'light' },
                        legend: { labels: { colors: isDark ? '#fff' : '#000' } }
                    }, false, false);

                    apexChartInstance.updateSeries([
                        { name: currentChartMode, data: sliceInd },
                        { name: 'LTP', data: sliceLtp }
                    ], false);
                }
            } catch (err) {
                console.error("ApexCharts error: ", err);
            }
        }

        function resetChartZoom() {
            const sliderEl = document.getElementById('html-slider');
            if (sliderEl && sliderEl.noUiSlider && cachedTimeCategories.length > 0) {
                sliderEl.noUiSlider.set([0, cachedTimeCategories.length - 1]);
                renderApexChart(cachedTimeCategories, cachedIndicatorValues, cachedLtpValues, 0, cachedTimeCategories.length - 1, false);
            }
        }

        function runTrendScanner() {
            if (globalChartRawData.length === 0 || globalDashboardData.length === 0) return;
            
            try {
                let todayStr = getISTDateStr();
                let day_df = globalChartRawData.filter(r => {
                    return (r['Date'] || "").toString().trim() === todayStr;
                });

                let latestLookup = {};
                globalDashboardData.forEach(item => { latestLookup[item.SYMS || item.SYMBOL] = item; });
                
                let bullishRows = [], bearishRows = [];
                let symbols = [...new Set(day_df.map(r => (r['Symbol'] || r['SYMS'] || "").trim()).filter(Boolean))];

                symbols.forEach(sym => {
                    let sdf = day_df.filter(r => (r['Symbol'] || r['SYMS'] || "").trim() === sym);
                    sdf.sort((a, b) => (a['Time'] || "").localeCompare(b['Time'] || ""));
                    
                    if (sdf.length < 5) return;

                    let volSeries = sdf.map(r => parseFloat(r['VOL CPR'])).filter(v => !isNaN(v));
                    let pcrSeries = sdf.map(r => parseFloat(r['OPT PCR'])).filter(v => !isNaN(v));
                    let ltpSeries = sdf.map(r => parseFloat(r['LTP'])).filter(v => !isNaN(v));
                    
                    if (volSeries.length === 0 || pcrSeries.length === 0 || ltpSeries.length === 0) return;

                    let first_vol = (volSeries[0] + (volSeries[1]||0) + (volSeries[2]||0) + (volSeries[3]||0)) / Math.min(4, volSeries.length);
                    let first_pcr = (pcrSeries[0] + (pcrSeries[1]||0) + (pcrSeries[2]||0) + (pcrSeries[3]||0)) / Math.min(4, pcrSeries.length);
                    let first_ltp = (ltpSeries[0] + (ltpSeries[1]||0) + (ltpSeries[2]||0) + (ltpSeries[3]||0)) / Math.min(4, ltpSeries.length);
                    
                    let last_vol = volSeries[volSeries.length - 1];
                    let last_pcr = pcrSeries[pcrSeries.length - 1];
                    let last_ltp = ltpSeries[ltpSeries.length - 1];
                    
                    let max_vol = Math.max(...volSeries);
                    let min_vol = Math.min(...volSeries);

                    if (first_vol === 0 || isNaN(first_vol) || first_ltp === 0 || isNaN(first_ltp)) return;

                    let price_movement_pct = Math.abs((last_ltp - first_ltp) / first_ltp) * 100;
                    let is_price_stuck = price_movement_pct <= 1.5;

                    let info = latestLookup[sym] || {};
                    let ceCon = parseFloat(info.CE_CON || 0);
                    let peCon = parseFloat(info.PE_CON || 0);
                    let chgPct = parseFloat(info['CHG_%'] || 0);
                    let optPcr = parseFloat(info.O_PCR || 0);
                    let volCpr = parseFloat(info.V_CPR || 0);

                    if (is_price_stuck) {
                        let is_vol_bullish = (last_vol > first_vol) && (last_vol >= max_vol * 0.75);
                        let is_pcr_bullish = (last_pcr >= first_pcr * 0.90);
                        
                        if (is_vol_bullish && is_pcr_bullish && ceCon >= 70) {
                            bullishRows.push({ sym, chg: chgPct, pcr: optPcr, cpr: volCpr, ce: ceCon });
                        }

                        let is_vol_bearish = (last_vol < first_vol) && (min_vol > 0.1 ? last_vol <= min_vol * 1.25 : last_vol <= 0.5);
                        let is_pcr_bearish = (last_pcr <= first_pcr * 1.10);

                        if (is_vol_bearish && is_pcr_bearish && peCon >= 70) {
                            bearishRows.push({ sym, chg: chgPct, pcr: optPcr, cpr: volCpr, pe: peCon });
                        }
                    }
                });

                let bHtml = `<table class="w-full text-xs text-center"><tr class="bg-blue-900 text-white border-b border-blue-800"><th class="p-2.5">SYMBOL</th><th class="p-2.5">CHANGE %</th><th class="p-2.5">OPT PCR</th><th class="p-2.5">VOL CPR</th><th class="p-2.5">CE CONTRACT</th></tr>`;
                if(bullishRows.length === 0) {
                    bHtml += `<tr><td colspan="5" class="p-6 text-slate-400">No Bullish Stocks Matched</td></tr>`;
                } else {
                    bullishRows.sort((a,b) => b.ce - a.ce).forEach(r => {
                        bHtml += `<tr class="border-b border-slate-200 dark:border-slate-800"><td class="p-2.5 font-bold">${r.sym}</td><td class="p-2.5 text-green-600 dark:text-green-400 font-bold">+${Number(r.chg).toFixed(2)}%</td><td class="p-2.5">${Number(r.pcr).toFixed(2)}</td><td class="p-2.5">${Number(r.cpr).toFixed(2)}</td><td class="p-2.5 text-green-600 dark:text-green-400 font-bold">+${Number(r.ce).toFixed(1)}%</td></tr>`;
                    });
                }
                bHtml += `</table>`;
                document.getElementById('subtab-bullish').innerHTML = bHtml;

                let rHtml = `<table class="w-full text-xs text-center"><tr class="bg-blue-900 text-white border-b border-blue-800"><th class="p-2.5">SYMBOL</th><th class="p-2.5">CHANGE %</th><th class="p-2.5">OPT PCR</th><th class="p-2.5">VOL CPR</th><th class="p-2.5">PE CONTRACT</th></tr>`;
                if(bearishRows.length === 0) {
                    rHtml += `<tr><td colspan="5" class="p-6 text-slate-400">No Bearish Stocks Matched</td></tr>`;
                } else {
                    bearishRows.sort((a,b) => b.pe - a.pe).forEach(r => {
                        rHtml += `<tr class="border-b border-slate-200 dark:border-slate-800"><td class="p-2.5 font-bold">${r.sym}</td><td class="p-2.5 text-red-600 dark:text-red-400 font-bold">${Number(r.chg).toFixed(2)}%</td><td class="p-2.5">${Number(r.pcr).toFixed(2)}</td><td class="p-2.5">${Number(r.cpr).toFixed(2)}</td><td class="p-2.5 text-red-600 dark:text-red-400 font-bold">+${Number(r.pe).toFixed(1)}%</td></tr>`;
                    });
                }
                rHtml += `</table>`;
                document.getElementById('subtab-bearish').innerHTML = rHtml;
            } catch (err) {
                console.error("Trend Scanner Error:", err);
            }
        }

        function renderDashboard() {
            const showPct = document.getElementById("show-pct-toggle").checked;
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            if (globalDashboardData.length === 0) return;

            let sortedData = [...globalDashboardData].sort((a, b) => (Math.abs(b.CE_CON) + Math.abs(b.PE_CON)) - (Math.abs(a.CE_CON) + Math.abs(a.PE_CON)));
            sortedData.forEach(item => {
                let row = document.createElement("tr");
                
                // Colors matched exactly with Streamlit logic
                let openColor = String(item.OPEN_STATUS).includes("Gap Up") ? "#00AA00" : String(item.OPEN_STATUS).includes("Gap Down") ? "#FF0000" : "#00BFFF";
                let chgColor = parseFloat(item['CHG_%']) > 0 ? "#00AA00" : parseFloat(item['CHG_%']) < 0 ? "#FF0000" : "#888888";
                let ltpChgColor = parseFloat(item.LTP_CH) > 0 ? "#00AA00" : parseFloat(item.LTP_CH) < 0 ? "#FF0000" : "#888888";
                let ceColor = parseFloat(item.CE_CON) > 0 ? "#00AA00" : parseFloat(item.CE_CON) < 0 ? "#FF0000" : "#888888";
                let peColor = parseFloat(item.PE_CON) > 0 ? "#00AA00" : parseFloat(item.PE_CON) < 0 ? "#FF0000" : "#888888";
                let vPcrColor = parseFloat(item.V_PCR) >= 1.0 ? "#00AA00" : "#FF0000";
                let oPcrColor = parseFloat(item.O_PCR) >= 1.0 ? "#00AA00" : "#FF0000";
                let vCprColor = parseFloat(item.V_CPR) >= 1.0 ? "#00AA00" : "#FF0000";

                let pcrVal = showPct ? item.PCR_PCT : item.PCR_ABS;
                let volVal = showPct ? item.VOL_PCT : item.VOL_ABS;

                row.innerHTML = `
                    <td class="p-3 text-center font-bold">${item.SYMS}</td>
                    <td class="p-3 text-center font-bold" style="color: ${openColor}">${item.OPEN_STATUS}</td>
                    <td class="p-3 text-center font-bold" style="color: ${vPcrColor}">${Number(item.V_PCR).toFixed(2)}</td>
                    <td class="p-3 text-center font-bold" style="color: ${oPcrColor}">${Number(item.O_PCR).toFixed(2)}</td>
                    <td class="p-3 text-center font-bold" style="color: ${vCprColor}">${Number(item.V_CPR).toFixed(2)}</td>
                    <td class="p-3 text-center font-bold" style="color: ${ltpChgColor}">${Number(item.LTP_CH)>=0?'+':''}${Number(item.LTP_CH).toFixed(2)}</td>
                    <td class="p-3 text-center font-bold" style="color: ${chgColor}">${Number(item['CHG_%'])>=0?'+':''}${Number(item['CHG_%']).toFixed(2)}%</td>
                    <td class="p-3 text-center font-bold">${Number(item.LTP).toFixed(2)}</td>
                    <td class="p-3 text-center font-bold" style="color: ${ceColor}">${Number(item.CE_CON)>=0?'+':''}${Number(item.CE_CON).toFixed(1)}%</td>
                    <td class="p-3 text-center font-bold" style="color: ${peColor}">${Number(item.PE_CON)>=0?'+':''}${Number(item.PE_CON).toFixed(1)}%</td>
                    <td class="p-3 text-center font-bold" style="color: ${parseFloat(pcrVal)>=0?'#00AA00':'#FF0000'}">${Number(pcrVal).toFixed(2)}${showPct?'%':''}</td>
                    <td class="p-3 text-center font-bold" style="color: ${parseFloat(volVal)>=0?'#00AA00':'#FF0000'}">${Number(volVal).toFixed(2)}${showPct?'%':''}</td>
                `;
                tbody.appendChild(row);
            });
        }

        let sortDirections = {};
        function sortTable(columnIndex) {
            const table = document.querySelector("table");
            const tbody = table.querySelector("tbody");
            const rows = Array.from(tbody.querySelectorAll("tr"));
            
            if (!sortDirections[columnIndex]) sortDirections[columnIndex] = false;
            sortDirections[columnIndex] = !sortDirections[columnIndex];
            let asc = sortDirections[columnIndex];

            rows.sort((rowA, rowB) => {
                let cellA = rowA.cells[columnIndex].innerText.replace(/[%+,]/g, "").trim();
                let cellB = rowB.cells[columnIndex].innerText.replace(/[%+,]/g, "").trim();
                let valA = !isNaN(cellA) ? parseFloat(cellA) : cellA;
                let valB = !isNaN(cellB) ? parseFloat(cellB) : cellB;

                if (typeof valA === 'number' && typeof valB === 'number') {
                    return asc ? valA - valB : valB - valA;
                } else {
                    return asc ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
                }
            });

            tbody.innerHTML = "";
            rows.forEach(row => tbody.appendChild(row));
        }
    </script>
