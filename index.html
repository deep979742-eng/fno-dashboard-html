}

<script>

/* =========================================================
CONFIG
========================================================= */

const FIREBASE_URL =
"https://fyers-bot-606b9-default-rtdb.firebaseio.com";

firebase.initializeApp({
    databaseURL:FIREBASE_URL
});


/* =========================================================
GLOBAL STATE
========================================================= */

let globalDashboardData = [];

let globalChartRawData = [];

let currentChartMode = "Vol CPR";

let apexChartInstance = null;

let sliderInstance = null;

let currentActiveStock = "";

let currentActiveMode = "";

let cachedTimeCategories = [];

let cachedIndicatorValues = [];

let cachedLtpValues = [];

let sortDirections = {};

let lastDashboardHash = "";

let lastChartHash = "";

let trendTimer = null;

let dashboardTimer = null;

let chartTimer = null;

let trendRunning = false;


/* =========================================================
IST DATE
========================================================= */

function getISTDateStr(){

    const now = new Date();

    const ist =
    new Date(
        now.toLocaleString(
            "en-US",
            {timeZone:"Asia/Kolkata"}
        )
    );

    const yr =
    ist.getFullYear();

    const mo =
    String(ist.getMonth()+1)
    .padStart(2,"0");

    const da =
    String(ist.getDate())
    .padStart(2,"0");

    return `${yr}-${mo}-${da}`;
}


/* =========================================================
SAFE NUMBER
========================================================= */

function num(value, fallback=0){

    const n = parseFloat(value);

    return Number.isFinite(n)
        ? n
        : fallback;
}


/* =========================================================
SAFE TEXT
========================================================= */

function safeText(value){

    return String(
        value === undefined ||
        value === null
        ? ""
        : value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
THEME
========================================================= */

function toggleTheme(){

    const body =
    document.getElementById("body-tag");

    const btn =
    document.getElementById("theme-btn");

    if(body.classList.contains("dark")){

        body.classList.remove("dark");

        btn.innerText="☀️ Light";

        btn.className =
        "px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-xs font-bold text-amber-500 transition shadow-sm";

    }else{

        body.classList.add("dark");

        btn.innerText="🌙 Dark";

        btn.className =
        "px-3 py-1.5 rounded-lg border border-slate-800 bg-slate-950 text-xs font-bold text-yellow-400 transition shadow-sm";

    }

    if(
        !document
        .getElementById("view-chart")
        .classList
        .contains("hidden")
    ){

        updateChartData(true);

    }

}


/* =========================================================
TAB SWITCH
========================================================= */

function switchTab(tab){

    ["dash","chart","trend"]
    .forEach(t=>{

        document
        .getElementById(`view-${t}`)
        .classList
        .add("hidden");

        document
        .getElementById(`btn-${t}`)
        .className =
        "tab-btn px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 transition";

    });


    document
    .getElementById(`view-${tab}`)
    .classList
    .remove("hidden");


    document
    .getElementById(`btn-${tab}`)
    .className =
    "tab-btn px-4 py-1.5 rounded-md text-xs sm:text-sm font-bold bg-blue-600 text-white transition";


    if(tab==="chart"){

        setTimeout(
            ()=>updateChartData(true),
            100
        );

    }

}


/* =========================================================
TREND TAB
========================================================= */

function switchTrendSubTab(sub){

    const bull =
    document.getElementById("subtab-bullish");

    const bear =
    document.getElementById("subtab-bearish");

    const btnBull =
    document.getElementById("btn-sub-bull");

    const btnBear =
    document.getElementById("btn-sub-bear");


    if(sub==="bullish"){

        bull.classList.remove("hidden");

        bear.classList.add("hidden");

        btnBull.className =
        "px-4 py-1.5 rounded-lg text-xs font-bold bg-green-600 text-white";

        btnBear.className =
        "px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-400";

    }else{

        bull.classList.add("hidden");

        bear.classList.remove("hidden");

        btnBear.className =
        "px-4 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white";

        btnBull.className =
        "px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-400";

    }

}


/* =========================================================
FIREBASE DASHBOARD
========================================================= */

firebase
.database()
.ref("Dashboard/Latest")
.on("value",(snapshot)=>{

    const val =
    snapshot.val();

    if(!val) return;


    const timeEl =
    document.getElementById("live-time");

    if(val.time){

        timeEl.innerText =
        new Date(
            val.time * 1000
        ).toLocaleTimeString();

    }


    const newData =
    Array.isArray(val.data)
    ? val.data
    : [];


    globalDashboardData =
    newData;


    /*
    IMPORTANT:
    Do not render immediately.
    This prevents mobile freeze when
    Firebase sends multiple updates.
    */

    clearTimeout(dashboardTimer);

    dashboardTimer =
    setTimeout(()=>{

        renderDashboard();

        populateStockDropdown();

        scheduleTrendScanner();

    },250);

});


/* =========================================================
FIREBASE CHART HISTORY
========================================================= */

firebase
.database()
.ref("ChartHistory")
.on("value",(snapshot)=>{

    const val =
    snapshot.val();

    if(!val) return;


    const todayPrefix =
    getISTDateStr()
    .replace(/-/g,"");


    let rows=[];


    Object.keys(val)
    .forEach(k=>{

        if(!k.startsWith(todayPrefix))
            return;

        const item =
        val[k];


        if(
            item &&
            Array.isArray(item.data)
        ){

            rows =
            rows.concat(item.data);

        }

    });


    globalChartRawData =
    rows;


    clearTimeout(chartTimer);

    chartTimer =
    setTimeout(()=>{

        if(
            !document
            .getElementById("view-chart")
            .classList
            .contains("hidden")
        ){

            updateChartData(false);

        }

        scheduleTrendScanner();

    },400);

});


/* =========================================================
POPULATE STOCK DROPDOWN
========================================================= */

function populateStockDropdown(){

    const select =
    document.getElementById("stock-select");

    if(!select) return;


    const current =
    select.value;


    let symbols=[];


    if(globalDashboardData.length){

        symbols =
        globalDashboardData
        .map(
            i=>i.SYMS || i.SYMBOL
        )
        .filter(Boolean);

    }else{

        symbols =
        [
            ...new Set(
                globalChartRawData
                .map(
                    i=>
                    i.Symbol ||
                    i.SYMS ||
                    i.SYMBOL
                )
                .filter(Boolean)
            )
        ];

    }


    if(!symbols.length)
        return;


    symbols =
    [...new Set(symbols)]
    .sort();


    /*
    Don't rebuild select if
    symbols are unchanged.
    */

    const oldSymbols =
    [...select.options]
    .map(o=>o.value);


    if(
        oldSymbols.length === symbols.length &&
        oldSymbols.every(
            (v,i)=>v===symbols[i]
        )
    ){

        if(
            current &&
            symbols.includes(current)
        ){

            select.value=current;

        }

        return;

    }


    const frag =
    document.createDocumentFragment();


    symbols.forEach(sym=>{

        const opt =
        document.createElement("option");

        opt.value=sym;

        opt.textContent=sym;

        frag.appendChild(opt);

    });


    select.innerHTML="";

    select.appendChild(frag);


    if(
        current &&
        symbols.includes(current)
    ){

        select.value=current;

    }else{

        select.value=symbols[0];

    }

}


/* =========================================================
CHART MODE
========================================================= */

function setChartMode(mode){

    currentChartMode =
    mode;


    const vol =
    document.getElementById("mode-vol");

    const opt =
    document.getElementById("mode-opt");


    if(mode==="Vol CPR"){

        vol.className =
        "px-3 py-1.5 rounded-md text-xs font-bold bg-red-600 text-white";

        opt.className =
        "px-3 py-1.5 rounded-md text-xs font-bold text-slate-500 dark:text-slate-400";

    }else{

        opt.className =
        "px-3 py-1.5 rounded-md text-xs font-bold bg-blue-600 text-white";

        vol.className =
        "px-3 py-1.5 rounded-md text-xs font-bold text-slate-500 dark:text-slate-400";

    }


    updateChartData(true);

}


/* =========================================================
CHART DATA
========================================================= */

function updateChartData(forceRebuild=false){

    if(
        document
        .getElementById("view-chart")
        .classList
        .contains("hidden")
    )
        return;


    const selectedStock =
    document
    .getElementById("stock-select")
    .value;


    if(!selectedStock)
        return;


    const todayStr =
    getISTDateStr();


    const rows =
    globalChartRawData
    .filter(r=>{

        const d =
        String(
            r.Date || ""
        ).trim();

        const s =
        String(
            r.Symbol ||
            r.SYMS ||
            r.SYMBOL ||
            ""
        ).trim();

        const t =
        String(
            r.Time || ""
        ).trim();

        return(
            d===todayStr &&
            s===selectedStock &&
            t>="09:00" &&
            t!=="--:--"
        );

    });


    if(!rows.length){

        if(apexChartInstance){

            apexChartInstance.destroy();

            apexChartInstance=null;

        }


        document
        .getElementById("apex-chart-container")
        .innerHTML =
        `<p class="text-center text-slate-400 font-bold mt-10">
        Waiting for today's market data...
        </p>`;

        return;

    }


    /*
    Map by time.
    This is considerably faster than repeatedly
    filtering the same array.
    */

    const timeMap =
    new Map();


    rows.forEach(r=>{

        const t =
        String(r.Time).trim();


        let obj =
        timeMap.get(t);


        if(!obj){

            obj={
                Time:t,
                "Vol CPR":null,
                "OPT PCR":null,
                "LTP":null
            };

            timeMap.set(t,obj);

        }


        const vCpr =
        r["VOL CPR"] ??
        r["Vol CPR"] ??
        r["V_CPR"] ??
        r.VOL_CPR;


        const oPcr =
        r["OPT PCR"] ??
        r["Opt PCR"] ??
        r["O_PCR"] ??
        r.OPT_PCR;


        const ltp =
        r["LTP"] ??
        r.ltp;


        if(
            vCpr!==undefined &&
            vCpr!==null &&
            vCpr!==""
        )
            obj["Vol CPR"]=num(vCpr,null);


        if(
            oPcr!==undefined &&
            oPcr!==null &&
            oPcr!==""
        )
            obj["OPT PCR"]=num(oPcr,null);


        if(
            ltp!==undefined &&
            ltp!==null &&
            ltp!==""
        )
            obj.LTP=num(ltp,null);

    });


    let data =
    Array.from(timeMap.values());


    data.sort(
        (a,b)=>
        a.Time.localeCompare(b.Time)
    );


    /*
    Forward fill.
    */

    let lastVol=null;

    let lastOpt=null;

    let lastLtp=null;


    data.forEach(r=>{

        if(
            r["Vol CPR"]!==null &&
            Number.isFinite(r["Vol CPR"])
        ){

            lastVol=
            r["Vol CPR"];

        }else{

            r["Vol CPR"]=
            lastVol;

        }


        if(
            r["OPT PCR"]!==null &&
            Number.isFinite(r["OPT PCR"])
        ){

            lastOpt=
            r["OPT PCR"];

        }else{

            r["OPT PCR"]=
            lastOpt;

        }


        if(
            r.LTP!==null &&
            Number.isFinite(r.LTP)
        ){

            lastLtp=
            r.LTP;

        }else{

            r.LTP=
            lastLtp;

        }

    });


    data =
    data.filter(r=>{

        const target =
        currentChartMode==="Vol CPR"
        ? r["Vol CPR"]
        : r["OPT PCR"];

        return(
            target!==null &&
            r.LTP!==null
        );

    });


    if(!data.length)
        return;


    cachedTimeCategories =
    data.map(r=>r.Time);


    cachedIndicatorValues =
    data.map(
        r=>
        currentChartMode==="Vol CPR"
        ? r["Vol CPR"]
        : r["OPT PCR"]
    );


    cachedLtpValues =
    data.map(r=>r.LTP);


    const changedStock =
    currentActiveStock!==selectedStock;


    const changedMode =
    currentActiveMode!==currentChartMode;


    const rebuild =
    forceRebuild ||
    changedStock ||
    changedMode ||
    !apexChartInstance;


    currentActiveStock =
    selectedStock;

    currentActiveMode =
    currentChartMode;


    setupHtmlSlider(
        cachedTimeCategories,
        rebuild
    );


    let sIdx=0;

    let eIdx=
    cachedTimeCategories.length-1;


    const sliderEl =
    document.getElementById("html-slider");


    if(
        sliderEl &&
        sliderEl.noUiSlider
    ){

        const vals =
        sliderEl.noUiSlider.get();

        sIdx=
        parseInt(vals[0]);

        eIdx=
        parseInt(vals[1]);

    }


    renderApexChart(
        cachedTimeCategories,
        cachedIndicatorValues,
        cachedLtpValues,
        sIdx,
        eIdx,
        rebuild
    );

}


/* =========================================================
SLIDER
========================================================= */

function setupHtmlSlider(
    categories,
    resetRange
){

    const sliderEl =
    document.getElementById("html-slider");


    if(!categories.length)
        return;


    const maxRange =
    Math.max(
        1,
        categories.length-1
    );


    if(!sliderEl.noUiSlider){

        noUiSlider.create(
            sliderEl,
            {
                start:[0,maxRange],
                connect:true,
                range:{
                    min:0,
                    max:maxRange
                },
                step:1
            }
        );


        sliderEl.noUiSlider.on(
            "slide",
            values=>{

                const s=
                parseInt(values[0]);

                const e=
                parseInt(values[1]);


                document
                .getElementById("lbl-start")
                .innerText =
                "From: "+
                (categories[s]||"--:--");


                document
                .getElementById("lbl-end")
                .innerText =
                "To: "+
                (categories[e]||"--:--");

            }
        );


        sliderEl.noUiSlider.on(
            "set",
            values=>{

                const s=
                parseInt(values[0]);

                const e=
                parseInt(values[1]);


                renderApexChart(
                    cachedTimeCategories,
                    cachedIndicatorValues,
                    cachedLtpValues,
                    s,
                    e,
                    false
                );

            }
        );

    }else{

        sliderEl.noUiSlider.updateOptions(
            {
                range:{
                    min:0,
                    max:maxRange
                }
            },
            false
        );


        if(resetRange){

            sliderEl.noUiSlider.set(
                [0,maxRange]
            );

        }

    }


    const vals =
    sliderEl.noUiSlider.get();


    document
    .getElementById("lbl-start")
    .innerText =
    "From: "+
    (
        categories[
            parseInt(vals[0])
        ] || "--:--"
    );


    document
    .getElementById("lbl-end")
    .innerText =
    "To: "+
    (
        categories[
            parseInt(vals[1])
        ] || "--:--"
    );

}


/* =========================================================
APEX CHART
========================================================= */

function renderApexChart(
    categories,
    indicatorVals,
    ltpVals,
    sIdx,
    eIdx,
    forceRebuild
){

    if(!categories.length)
        return;


    sIdx=
    Math.max(
        0,
        Math.min(
            sIdx,
            categories.length-1
        )
    );


    eIdx=
    Math.max(
        0,
        Math.min(
            eIdx,
            categories.length-1
        )
    );


    if(sIdx>eIdx)
        return;


    const sliceCats =
    categories.slice(
        sIdx,
        eIdx+1
    );


    const sliceInd =
    indicatorVals.slice(
        sIdx,
        eIdx+1
    );


    const sliceLtp =
    ltpVals.slice(
        sIdx,
        eIdx+1
    );


    const indColor =
    currentChartMode==="Vol CPR"
    ? "#FF4D4D"
    : "#00BFFF";


    const isDark =
    document
    .getElementById("body-tag")
    .classList
    .contains("dark");


    const container =
    document
    .getElementById("apex-chart-container");


    try{

        if(
            !apexChartInstance ||
            forceRebuild
        ){

            if(apexChartInstance){

                apexChartInstance.destroy();

                apexChartInstance=null;

            }


            container.innerHTML="";


            const options={

                series:[

                    {
                        name:currentChartMode,
                        type:"area",
                        data:sliceInd
                    },

                    {
                        name:"LTP",
                        type:"line",
                        data:sliceLtp
                    }

                ],


                chart:{

                    height:440,

                    type:"line",

                    toolbar:{
                        show:false
                    },

                    zoom:{
                        enabled:false
                    },

                    animations:{
                        enabled:false
                    },

                    background:"transparent",

                    redrawOnParentResize:true

                },


                colors:[
                    indColor,
                    "#00CC66"
                ],


                stroke:{
                    curve:"smooth",
                    width:[3,3]
                },


                fill:{
                    type:[
                        "gradient",
                        "solid"
                    ],

                    gradient:{
                        shadeIntensity:1,
                        opacityFrom:.35,
                        opacityTo:.05,
                        stops:[0,100]
                    }

                },


                dataLabels:{
                    enabled:false
                },


                xaxis:{

                    categories:sliceCats,

                    labels:{
                        style:{
                            colors:
                            isDark
                            ? "#94a3b8"
                            : "#888"
                        },

                        fontSize:"11px"
                    },

                    tickAmount:
                    window.innerWidth<600
                    ? 6
                    : 10

                },


                yaxis:[

                    {

                        title:{
                            text:currentChartMode,
                            style:{
                                color:indColor
                            }
                        },

                        labels:{
                            style:{
                                colors:indColor
                            }
                        },

                        decimalsInFloat:2

                    },


                    {

                        opposite:true,

                        title:{
                            text:"LTP",
                            style:{
                                color:"#00CC66"
                            }
                        },

                        labels:{
                            style:{
                                colors:"#00CC66"
                            }
                        },

                        decimalsInFloat:2

                    }

                ],


                tooltip:{

                    shared:true,

                    intersect:false,

                    theme:
                    isDark
                    ? "dark"
                    : "light"

                },


                legend:{

                    position:"top",

                    horizontalAlign:"right",

                    labels:{
                        colors:
                        isDark
                        ? "#fff"
                        : "#000"
                    }

                },


                grid:{

                    borderColor:
                    isDark
                    ? "#334155"
                    : "#e2e8f0",

                    strokeDashArray:3

                }

            };


            apexChartInstance =
            new ApexCharts(
                container,
                options
            );


            apexChartInstance.render();


        }else{


            /*
            LIGHTWEIGHT UPDATE.
            Chart is NOT destroyed.
            */

            apexChartInstance.updateOptions(
                {

                    xaxis:{

                        categories:sliceCats,

                        labels:{
                            style:{
                                colors:
                                isDark
                                ? "#94a3b8"
                                : "#888"
                            },

                            fontSize:"11px"
                        },

                        tickAmount:
                        window.innerWidth<600
                        ? 6
                        : 10

                    },


                    yaxis:[

                        {

                            title:{
                                text:currentChartMode,
                                style:{
                                    color:indColor
                                }
                            },

                            labels:{
                                style:{
                                    colors:indColor
                                }
                            },

                            decimalsInFloat:2

                        },

                        {

                            opposite:true,

                            title:{
                                text:"LTP",
                                style:{
                                    color:"#00CC66"
                                }
                            },

                            labels:{
                                style:{
                                    colors:"#00CC66"
                                }
                            },

                            decimalsInFloat:2

                        }

                    ],


                    colors:[
                        indColor,
                        "#00CC66"
                    ],


                    grid:{
                        borderColor:
                        isDark
                        ? "#334155"
                        : "#e2e8f0"
                    },


                    tooltip:{
                        theme:
                        isDark
                        ? "dark"
                        : "light"
                    },


                    legend:{
                        labels:{

                            ? "#fff"

                    }

            );


            apexChartInstance.updateSeries(

                [

                    {

                    }

/* =========================================================
TREND SCANNER SCHEDULER
========================================================= */

function scheduleTrendScanner(){

    clearTimeout(trendTimer);


    /*
    Don't calculate immediately.
    Wait for Firebase bursts to settle.
    */

    trendTimer =
    setTimeout(
        runTrendScanner,
        800
    );

}


/* =========================================================
TREND SCANNER
========================================================= */

function runTrendScanner(){

    if(trendRunning)
        return;


    if(
        !globalChartRawData.length ||
        !globalDashboardData.length
    )
        return;


    trendRunning=true;


    try{

        const todayStr =
        getISTDateStr();


        /*
        Filter today's records ONCE.
        */

        const day_df =
        globalChartRawData.filter(
            r=>
            String(
                r.Date || ""
            ).trim()===todayStr
        );


        if(!day_df.length)
            return;


        /*
        Latest dashboard lookup.
        */

        const latestLookup={};


        globalDashboardData
        .forEach(item=>{

            const sym =
            item.SYMS ||
            item.SYMBOL;

            if(sym)
                latestLookup[sym]=item;

        });


        /*
        Group chart history by symbol.
        This avoids repeatedly doing:
        day_df.filter(...)
        */

        const symbolMap =
        new Map();


        day_df.forEach(r=>{

            const sym =
            String(
                r.Symbol ||
                r.SYMS ||
                r.SYMBOL ||
                ""
            ).trim();


            if(!sym)
                return;


            if(!symbolMap.has(sym))
                symbolMap.set(sym,[]);


            symbolMap
            .get(sym)
            .push(r);

        });


        const bullishRows=[];

        const bearishRows=[];


        symbolMap.forEach(
            (sdf,sym)=>{

                if(sdf.length<5)
                    return;


                sdf.sort(
                    (a,b)=>
                    String(
                        a.Time||""
                    ).localeCompare(
                        String(
                            b.Time||""
                        )
                    )
                );


                const volSeries=[];

                const pcrSeries=[];

                const ltpSeries=[];


                sdf.forEach(r=>{

                    const v=
                    num(
                        r["VOL CPR"] ??
                        r["Vol CPR"] ??
                        r["V_CPR"],
                        NaN
                    );


                    const p=
                    num(
                        r["OPT PCR"] ??
                        r["Opt PCR"] ??
                        r["O_PCR"],
                        NaN
                    );


                    const l=
                    num(
                        r["LTP"],
                        NaN
                    );


                    if(!isNaN(v))
                        volSeries.push(v);


                    if(!isNaN(p))
                        pcrSeries.push(p);


                    if(!isNaN(l))
                        ltpSeries.push(l);

                });


                if(
                    !volSeries.length ||
                    !pcrSeries.length ||
                    !ltpSeries.length
                )
                    return;


                const firstCount =
                Math.min(
                    4,
                    volSeries.length
                );


                let first_vol=0;

                for(
                    let i=0;
                    i<firstCount;
                    i++
                ){

                    first_vol +=
                    volSeries[i] || 0;

                }

                first_vol /=
                firstCount;


                const firstPcrCount =
                Math.min(
                    4,
                    pcrSeries.length
                );


                let first_pcr=0;

                for(
                    let i=0;
                    i<firstPcrCount;
                    i++
                ){

                    first_pcr +=
                    pcrSeries[i] || 0;

                }

                first_pcr /=
                firstPcrCount;


                const firstLtpCount =
                Math.min(
                    4,
                    ltpSeries.length
                );


                let first_ltp=0;

                for(
                    let i=0;
                    i<firstLtpCount;
                    i++
                ){

                    first_ltp +=
                    ltpSeries[i] || 0;

                }

                first_ltp /=
                firstLtpCount;


                const last_vol =
                volSeries[
                    volSeries.length-1
                ];


                const last_pcr =
                pcrSeries[
                    pcrSeries.length-1
                ];


                const last_ltp =
                ltpSeries[
                    ltpSeries.length-1
                ];


                const max_vol =
                Math.max(...volSeries);


                const min_vol =
                Math.min(...volSeries);


                if(
                    first_vol===0 ||
                    !isFinite(first_vol) ||
                    first_ltp===0 ||
                    !isFinite(first_ltp)
                )
                    return;


                const priceMovementPct =
                Math.abs(
                    (last_ltp-first_ltp)
                    /
                    first_ltp
                )*100;


                const priceStuck =
                priceMovementPct<=1.5;


                if(!priceStuck)
                    return;


                const info =
                latestLookup[sym] || {};


                const ceCon =
                num(info.CE_CON);


                const peCon =
                num(info.PE_CON);


                const chgPct =
                num(info["CHG_%"]);


                const optPcr =
                num(info.O_PCR);


                const volCpr =
                num(info.V_CPR);


                /*
                BULLISH
                */

                const volBullish =
                last_vol>first_vol &&
                last_vol>=max_vol*.75;


                const pcrBullish =
                last_pcr>=first_pcr*.90;


                if(
                    volBullish &&
                    pcrBullish &&
                    ceCon>=70
                ){

                    bullishRows.push({

                        sym,
                        chg:chgPct,
                        pcr:optPcr,
                        cpr:volCpr,
                        ce:ceCon

                    });

                }


                /*
                BEARISH
                */

                const volBearish =
                last_vol<first_vol &&
                (
                    min_vol>.1
                    ? last_vol<=min_vol*1.25
                    : last_vol<=.5
                );


                const pcrBearish =
                last_pcr<=first_pcr*1.10;


                if(
                    volBearish &&
                    pcrBearish &&
                    peCon>=70
                ){

                    bearishRows.push({

                        sym,
                        chg:chgPct,
                        pcr:optPcr,
                        cpr:volCpr,
                        pe:peCon

                    });

                }

            }
        );


        renderTrendTables(
            bullishRows,
            bearishRows
        );


    }catch(err){

        console.warn(
            "Trend scanner error:",
            err
        );

    }finally{

        trendRunning=false;

    }

}

/* =========================================================
DASHBOARD RENDER
========================================================= */

function renderDashboard(){

    const showPct =
    document
    .getElementById("show-pct-toggle")
    .checked;


    const tbody =
    document.getElementById(
        "table-body"
    );


    if(!globalDashboardData.length){

        tbody.innerHTML=
        `<tr>
        <td colspan="12"
        class="text-center p-8 text-slate-400">
        Waiting for Firebase data...
        </td>
        </tr>`;

        return;

    }


    /*
    Create lightweight hash.
    If data hasn't really changed,
    don't rebuild the entire table.
    */

    const hash =
    globalDashboardData
    .map(
        x=>
        `${x.SYMS}|${x.LTP}|${x.CE_CON}|${x.PE_CON}|${x.O_PCR}|${x.V_CPR}|${x.CHG_%}`
    )
    .join("||");


    const pctState =
    showPct
    ? "P"
    : "A";


    const finalHash =
    pctState+"|"+hash;


    if(
        finalHash===lastDashboardHash
    )
        return;


    lastDashboardHash=
    finalHash;


    const sortedData =
    [...globalDashboardData]
    .sort(
        (a,b)=>
        (
            Math.abs(num(b.CE_CON))+
            Math.abs(num(b.PE_CON))
        )
        -
        (
            Math.abs(num(a.CE_CON))+
            Math.abs(num(a.PE_CON))
        )
    );


    const fragment =
    document.createDocumentFragment();


    sortedData.forEach(item=>{

        const row =
        document.createElement("tr");


        const chgPct =
        num(item["CHG_%"]);


        const ltpCh =
        num(item.LTP_CH);


        const ce =
        num(item.CE_CON);


        const pe =
        num(item.PE_CON);


        const vPcr =
        num(item.V_PCR);


        const oPcr =
        num(item.O_PCR);


        const vCpr =
        num(item.V_CPR);


        const pcrVal =
        showPct
        ? num(item.PCR_PCT)
        : num(item.PCR_ABS);


        const volVal =
        showPct
        ? num(item.VOL_PCT)
        : num(item.VOL_ABS);


        const openStatus =
        String(
            item.OPEN_STATUS || ""
        );


        const openColor =
        openStatus.includes("Gap Up")
        ? "#00AA00"
        : openStatus.includes("Gap Down")
        ? "#FF0000"
        : "#00BFFF";


        const chgColor =
        chgPct>0
        ? "#00AA00"
        : chgPct<0
        ? "#FF0000"
        : "#888888";


        const ltpChgColor =
        ltpCh>0
        ? "#00AA00"
        : ltpCh<0
        ? "#FF0000"
        : "#888888";


        const ceColor =
        ce>0
        ? "#00AA00"
        : ce<0
        ? "#FF0000"
        : "#888888";


        const peColor =
        pe>0
        ? "#00AA00"
        : pe<0
        ? "#FF0000"
        : "#888888";


        const vPcrColor =
        vPcr>=1
        ? "#00AA00"
        : "#FF0000";


        const oPcrColor =
        oPcr>=1
        ? "#00AA00"
        : "#FF0000";


        const vCprColor =
        vCpr>=1
        ? "#00AA00"
        : "#FF0000";


        row.innerHTML=

        `<td class="p-3 text-center font-bold">
        ${safeText(item.SYMS)}
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${openColor}">
        ${safeText(openStatus)}
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${vPcrColor}">
        ${vPcr.toFixed(2)}
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${oPcrColor}">
        ${oPcr.toFixed(2)}
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${vCprColor}">
        ${vCpr.toFixed(2)}
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${ltpChgColor}">
        ${ltpCh>=0?"+":""}${ltpCh.toFixed(2)}
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${chgColor}">
        ${chgPct>=0?"+":""}${chgPct.toFixed(2)}%
        </td>

        <td class="p-3 text-center font-bold">
        ${num(item.LTP).toFixed(2)}
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${ceColor}">
        ${ce>=0?"+":""}${ce.toFixed(1)}%
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${peColor}">
        ${pe>=0?"+":""}${pe.toFixed(1)}%
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${pcrVal>=0?"#00AA00":"#FF0000"}">
        ${pcrVal.toFixed(2)}${showPct?"%":""}
        </td>

        <td class="p-3 text-center font-bold"
        style="color:${volVal>=0?"#00AA00":"#FF0000"}">
        ${volVal.toFixed(2)}${showPct?"%":""}
        </td>`;


        fragment.appendChild(row);

    });


    /*
    One DOM operation instead of
    appendChild for every row.
    */

    tbody.replaceChildren(fragment);

}


/* =========================================================
SORT TABLE
========================================================= */

function sortTable(columnIndex){

    const table =
    document.getElementById(
        "dashboard-table"
    );


    const tbody =
    table.querySelector("tbody");


    const rows =
    Array.from(
        tbody.querySelectorAll("tr")
    );


    if(rows.length<2)
        return;


    if(
        sortDirections[columnIndex]===undefined
    ){

        sortDirections[columnIndex]=false;

    }


    sortDirections[columnIndex]=
    !sortDirections[columnIndex];


    const asc =
    sortDirections[columnIndex];


    rows.sort(
        (rowA,rowB)=>{

            const cellA =
            rowA.cells[columnIndex]
            ?.innerText
            .replace(/[%+,]/g,"")
            .trim() || "";


            const cellB =
            rowB.cells[columnIndex]
            ?.innerText
            .replace(/[%+,]/g,"")
            .trim() || "";


            const numA =
            parseFloat(cellA);


            const numB =
            parseFloat(cellB);


            if(
                !isNaN(numA) &&
                !isNaN(numB)
            ){

                return asc
                ? numA-numB
                : numB-numA;

            }


            return asc
            ? cellA.localeCompare(cellB)
            : cellB.localeCompare(cellA);

        }
    );


    const fragment =
    document.createDocumentFragment();


    rows.forEach(row=>
        fragment.appendChild(row)
    );


    tbody.replaceChildren(fragment);

}


/* =========================================================
INITIAL LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{

        /*
        Prevent accidental horizontal
        browser gestures from freezing
        the page on some mobile browsers.
        */

        document.body.style.touchAction=
        "pan-y";

    }
);


/* =========================================================
VISIBILITY OPTIMIZATION
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            document.hidden
        ){

            clearTimeout(trendTimer);

        }else{

            scheduleTrendScanner();

            if(
                !document
                .getElementById("view-chart")
                .classList
                .contains("hidden")
            ){

                setTimeout(
                    ()=>updateChartData(false),
                    300
                );

            }

        }

    }
);

</script>
